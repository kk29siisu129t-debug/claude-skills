<title>LP Studio（自己完結版）</title>
<style>:root{--bg:#f4f5f8;--card:#fff;--ink:#1b1f2b;--muted:#5a6172;--line:#d9dde6;--pri:#2741b8;--ok:#1f6f5c;--ng:#a3271b;--warn:#7a4b00;--focus:#ffbf00}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP","IPAPGothic","IPAGothic",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.7;overflow-x:hidden}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,.btn,select,input,textarea{font:inherit;color:inherit}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;line-height:1.3}
button:hover,.btn:hover{border-color:var(--pri)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
button.danger{color:var(--ng)}
input[type=text],input[type=url],input[type=number],input[type=date],textarea,select{width:100%;min-width:0;padding:7px 10px;border:1px solid #b8bfcc;border-radius:8px;background:#fff}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid #b8bfcc;border-radius:8px;background:#fff;flex:none}
textarea{resize:vertical}
.topbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 12px;background:#141826;color:#fff}
.topbar select{width:auto;background:#232838;border-color:#3a4157;color:#fff;font-size:13px;min-height:32px;padding:4px 8px}
.topbar .brand{font-weight:800;letter-spacing:.04em}
.topbar .ver{font-size:11px;opacity:.7;margin-left:4px}

.topbar .pname input{min-height:32px;padding:4px 10px}
.ai-status{font-size:12px;line-height:1.4;background:#3a3f55;color:#ffe9a8;border-radius:999px;padding:3px 10px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);max-width:min(92vw,560px);background:#141826;color:#fff;border-radius:10px;padding:10px 16px;opacity:0;pointer-events:none;transition:.25s;z-index:100;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast[data-kind=error]{background:var(--ng)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 0;background:#e6e8ee;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs [role=tab]{flex:none;border-radius:8px 8px 0 0;border-bottom:none;background:#f3f4f7;font-size:14px;min-height:34px;padding:4px 12px}
.tabs [role=tab][aria-selected=true]{background:var(--card);font-weight:800;border-color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
main{padding:12px 16px 16px;max-width:1600px;margin:0 auto;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.card h2{font-size:18px;margin:0 0 8px}.card h3{font-size:16px;margin:12px 0 6px}.card h4{font-size:13px;margin:10px 0 2px;color:var(--muted)}
.sec-title{font-size:17px;margin:20px 0 8px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-2 .card{margin-bottom:0}
.span-all{grid-column:1/-1}
.plan-layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.plan-layout .card{margin-bottom:0}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:16px;align-items:start}
.design .card{margin-bottom:0}
.field{margin:10px 0;display:grid;gap:4px}
.field>label{font-weight:700;font-size:14px}
.field.st-unconfirmed{border-left:4px solid #e1b100;padding-left:8px}
.field.st-missing{border-left:4px solid var(--ng);padding-left:8px}
.field.st-confirmed{border-left:4px solid var(--ok);padding-left:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.row>select{width:auto}
.row>input[type=text],.row>input[type=number],.row>input[type=date]{flex:1 1 140px;width:auto}
.row.tiny button{min-height:30px;padding:3px 9px;font-size:13px}
.muted{color:var(--muted)}.small{font-size:13px}
.hint{font-size:12px;border-radius:4px;padding:1px 6px}
.lv-missing,.lv-block{color:var(--ng)}.lv-unconfirmed,.lv-claim,.lv-token,.lv-placeholder,.lv-unverified,.lv-review,.lv-unapproved{color:var(--warn)}
.badge{display:inline-block;font-size:12px;line-height:1.5;font-weight:700;border-radius:999px;padding:1px 8px;background:#e8ebf2;color:#2a3040;margin:1px 2px 1px 0}
.badge.ok{background:#dff1ea;color:var(--ok)}
.badge.soft{background:#f1f2f5;color:var(--muted);font-weight:500}
.badge.lv-missing,.badge.lv-block{background:#fbe3df;color:var(--ng)}
.badge.lv-unconfirmed,.badge.lv-claim,.badge.lv-token,.badge.lv-placeholder,.badge.lv-unverified,.badge.lv-review,.badge.lv-unapproved{background:#fff1cc;color:var(--warn)}
.ok{color:var(--ok)}.ng{color:var(--ng)}.warn{color:var(--warn)}
ul.plain{list-style:none;padding:0;margin:4px 0}
.tokens{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.token{display:grid;grid-template-columns:auto 1fr;gap:4px 6px;align-items:center}
.token label{grid-column:1/-1;font-weight:700;font-size:13px}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.mode{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;background:#fff}
.mode.on{border-color:var(--pri);background:#eef1ff;font-weight:700}
.mode-body{margin-top:8px}
label.inline{display:flex;gap:6px;align-items:flex-start;font-size:14px;margin:4px 0}
label.inline input{margin-top:5px;flex:none}
ol.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fafbfc}
.plan-item.sel{border-color:var(--pri);background:#eef1ff}
.plan-item .pick{display:grid;gap:2px;text-align:left;width:100%;border:none;background:transparent;padding:2px 0;justify-content:start}
.plan-item .role{font-size:12px;color:var(--muted);font-weight:400}
.plan-item .tags{margin:4px 0}
fieldset.refs{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 10px}
ul.issues{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px;font-size:13px}
.alert{background:#fbe3df;border:1px solid #f0b8ae;color:#5e140c;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.alert ul{margin:4px 0;padding-left:18px}
.okbox{background:#dff1ea;border:1px solid #a9d8c6;color:#0f4b3c;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.frame-wrap{--scale:1;width:calc(var(--fw) * var(--scale));height:calc(var(--fh) * var(--scale));overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
.frame-wrap iframe{width:var(--fw);height:var(--fh);border:0;transform:scale(var(--scale));transform-origin:0 0;display:block;background:#fff}
.cta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cta-card.active{border-color:var(--pri);box-shadow:0 0 0 2px #c9d1ff}
.table-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f3f4f7;white-space:nowrap}
.fiction-banner{position:sticky;top:0;z-index:5;background:#5e140c;color:#fff;font-weight:700;padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:14px}
.verdicts{padding-left:18px;font-size:14px}
.v-not-evaluable strong{color:var(--warn)}.v-difference-observed strong{color:var(--ok)}
.hyp .prio{font-size:12px;border-radius:999px;padding:1px 8px;color:#fff;background:#6b7280;vertical-align:2px}
.prio.p-高{background:var(--ng)}.prio.p-中{background:#b26a00}
.hyp ul{margin:2px 0;padding-left:18px;font-size:14px}
details summary{cursor:pointer;font-size:14px;margin:6px 0}
#gen-prompt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.rep-errors,.rep-rejected{color:var(--ng)}.rep-warnings{color:var(--warn)}.rep-added{color:var(--ok)}

.hint{font-size:12px;color:var(--muted);margin:0}
.field-row{align-items:flex-end}.field-row .field{flex:1 1 220px;margin:4px 0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:8px 0 0;font-size:14px}.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0}

.pv-status{font-size:13px;font-weight:700;margin-left:auto}.pv-status.ok{color:var(--ok)}.pv-status.ng{color:var(--ng)}
.frame-box{position:relative}

.scale-tag[data-scaled="1"]{background:#fff1cc;color:var(--warn)}
.design.dev-pc,.design.dev-sp{grid-template-columns:minmax(0,1fr)}

.gate h2{font-size:16px}.gate ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.gate.ok{background:#e9f6f0;border-color:#a9d8c6}.gate.ng{background:#fff4ec;border-color:#f0c8a8}
.rep-stop{color:var(--ng)}.rep-warn{color:var(--warn)}
@media (max-width:760px){.gates{grid-template-columns:minmax(0,1fr)}.ai-status{display:none}.kv{grid-template-columns:minmax(0,1fr)}}
.pv-card{padding:10px 12px}
.pv-toolbar{margin-bottom:8px;padding:6px 10px}
.design{gap:12px}
#fv-design dd,#fv-design li,#fv-design .small{overflow-wrap:anywhere;min-width:0}
#fv-design .research{padding-left:18px;margin:12px 0 0}#fv-design .research li{margin-bottom:8px}
#public-sources li,#public-sources .small{overflow-wrap:anywhere;min-width:0}#public-sources .research{padding-left:18px}
</style>
</head>
<body>
<header class="topbar">

<div id="toast" class="toast" role="status" aria-live="polite"></div>

  <button role="tab" id="tab-gen" aria-controls="panel" data-tab="gen">8 生成</button>
</nav>

験談で、自社の顧客調査ではない。仕事帰りの会社員そのものの観察ではない。無料コミュニティでの経験は、有料の週ごとの支援に払う意思の証拠にならない。\"\n    },\n    {\n      \"id\": \"pub-crear-2kyu\",\n      \"url\": \"https://www.crear-ac.co.jp/boki/taikenki/2kilyuu-220824-1/\",\n      \"title\": \"CREAR 簿記2級 体験記（仕事と学習の中断・再開）\",\n      \"kind\": \"learner-story\",\n      \"use\": \"supporting-hypothesis\",\n      \"observation\": \"仕事と学習の両立で、学習が中断し、再開した経緯が公表されている。\",\n      \"caveat\": \"計画の組み直し・再開に関する補助的な仮説の材料。ミチシルベの実績や効果には転用しない。\"\n    },\n    {\n      \"id\": \"pub-studying-news\",\n      \"url\": \"https://studying.jp/news/20251225_boki.html\",\n      \"title\": \"スタディング 簿記講座のお知らせ\",\n      \"kind\": \"competitor\",\n      \"use\": \"competitor-check\",\n      \"observation\": \"競合も学習計画・見直し・相談に関わる機能を提供している。\",\n      \"caveat\": \"「このサービスだけ」「教材には計画支援がない」などの優位性を作らない。\"\n    },\n    {\n      \"id\": \"pub-studying-course\",\n      \"url\": \"https://studying.jp/boki/itempage/course2-26.html\",\n      \"title\": \"スタディング 簿記2級コース\",\n      \"kind\": \"competitor\",\n      \"use\": \"competitor-check\",\n      \"observation\": \"競合のコースページ。計画・見直し・相談の支援を含む。\",\n      \"caveat\": \"競合の機能と比べた優位性は主張しない。\"\n    }\n  ],\n  \"fvDesign\": {\n    \"viewportFirst\": \"sp\",\n    \"visualRole\": \"夜に自宅で学ぶ大人の顔を主役にし、H1 の内心の問いを、読者が自分の場面として受け取れる入口にする。人物は講師・受講生・推薦者ではない（AI生成の架空の人物）\",\n    \"gaze\": \"toward-copy\",\n    \"fit\": \"対象は働きながら簿記2級を学ぶ大人（提供者の申告 s1-target。架空サービス）。写真の alt「夜、自宅の机でノートに書き込みながら学習する大人」の場面は、提供者の申告する内容（学習を15分の単位で計画し、週ごとに見直す）と矛盾しない\",\n    \"maxChars\": 80,\n    \"primaryCtas\": 1,\n    \"requiredAssets\": [],\n    \"researchNotes\": [\n      {\n        \"source\": \"Hutton & Nolte (2011); Sajjacholapunt & Ball (2014)\",\n        \"caveat\": \"注視・記憶の研究。離脱率・CVRの改善を示すものではない\",\n        \"claim\": \"広告内の人物の視線を商品・情報へ向けると、その対象への注視配分や記憶に影響した\",\n        \"status\": \"research\"\n      },\n      {\n        \"source\": \"Tuch et al. (2012) https://research.google/pubs/the-role-of-visual-complexity-and-prototypicality-regarding-first-impression-of // 規則: ひらがな・記号だけの断片は前の塊に付ける／開きかっこは次の塊に付ける／句読点の後で塊を区切る。
// 指定の改行候補（headingPhrases）があればそれを優先し、無い・合わない場合だけこの推定を使う。

const OPEN = /^[「『（(［【〈《"']+$/;
const PUNCT_END = /[、。，．！？!?」』）)］】〉》]$/;

    if ((w === 'お' || w === 'ご' || w === '御') && !pendingOpen) {

      if (cur && !/[\p{Script=Hiragana}」』]$/u.test(cur)) { pendingOpen = w; continue; }

      pendingOpen = w;
      continue;

})();

          metricTarget: str(100), metricPeriod: str(60), metricDenominator: str(100), metricDefinition: str(200),
          note: str(300),
        },
        required: ['id', 'claim', 'kind', 'reality', 'source', 'status', 'provenance'],
      },
    },
    insights: {
      t: 'array', max: 10,
      of: {
        t: 'object',
        fields: {
          id: ID, statement: str(300), readFromSource: str(300), inferred: str(300), sourceRefs: refs,
          confidence: { t: 'string', enum: CONFIDENCE }, alternatives: strList(200, 5), questions: strList(200, 5),
          status: { t: 'string', enum: ['hypothesis', 'supported'] }, provenance: { t: 'string', enum: PROVENANCE },
        },
        required: ['id', 'statement', 'sourceRefs', 'status'],
      },
    },
    angles: {
      t: 'array', max: 6,
      of: {
        t: 'object',
        fields: {
          id: ID, statement: str(200), insightId: str(40), sourceRefs: refs, rationale: str(400),
          scores: { t: 'object', fields: { evidence: { t: 'number', min: 0, max: 3, int: true }, fit: { t: 'number', min: 0, max: 3, int: true }, specificity: { t: 'number', min: 0, max: 3, int: true }, nextAction: { t: 'number', min: 0, max: 3, int: true } }, required: [] },
        },
        required: ['id', 'statement', 'sourceRefs'],
      },
    },
    chosenAngleId: str(40),
    sections: { t: 'array', of: SECTION_SPEC, max: 20 },
    // 公開資料（学習者の公開体験・競合のページ）。課題理解とインサイト仮説の材料だけに使い、LP の根拠・口コミ・実績には使わない
    publicSources: {
      t: 'array', max: 20,
      of: { t: 'object', fields: { id: ID, url: str(300), title: str(120), kind: { t: 'string', enum: ['learner-story', 'competitor', 'article'] }, observation: str(400), use: { t: 'string', enum: ['context', 'supporting-hypothesis', 'competitor-check'] }, caveat: str(400) }, required: ['id', 'url', 'kind', 'observation', 'caveat'] },
    },
    // FV の設計メモ（生成・人が書く）。研究の参照は「設計の根拠」であり効果の保証ではない。FV の本文には出さない
    fvDesign: {
      t: 'object', nullable: true,
      fields: {
        viewportFirst: { t: 'string', enum: ['sp', 'pc'] },
        visualRole: str(200), gaze: { t: 'string', enum: ['toward-copy', 'toward-cta', 'front', 'none'] }, fit: str(300),
        maxChars: { t: 'number', min: 20, max: 200, int: true }, primaryCtas: { t: 'number', min: 1, max: 1, int: true },
        requiredAssets: strList(200, 8),
        researchNotes: { t: 'array', max: 12, of: { t: 'object', fields: { claim: str(300), source: str(300), status: { t: 'string', enum: ['research', 'hypothesis', 'design-condition'] }, caveat: str(300) }, required: ['claim', 'status'] } },
        evaluationPlan: str(500),
      },
      required: [],
    },
    selfCheck: {
      t: 'object', nullable: true,
      fields: { readAloud: strList(200, 12), consistency: str(400), missing: strList(200, 12), spLength: str(300), openQuestions: strList(200, 12) },
      required: [],
    },
    cta: {
      t: 'object',
      fields: {
        activeVariant: str(40),
        variants: { t: 'array', max: 4, min: 1, of: { t: 'object', fields: { id: ID, label: str(40), color: str(7), timing: { t: 'string', enum: CTA_TIMINGS_ACCEPTED } }, required: ['id', 'label', 'color', 'timing'] } },
      },
      required: ['activeVariant', 'variants'],
    },
    lpo: { t: 'object', fields: { dataset: { ...DATASET_SPEC, nullable: true } }, required: [] },
    // 人が用意した素材。生成では作らない・上書きしない
    assets: {
      t: 'object',
      fields: {
        // FV の人物写真（架空のイメージ人物）。実在の顧客・講師・推薦者として扱わない
        heroPortrait: {
          t: 'object', nullable: true,
          fields: {
            dataUri: str(1600000, { pattern: /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/ }),
            alt: str(80), caption: str(40), gaze: { t: 'string', enum: ['left', 'right'] }, flip: { t: 'bool' },
            focusX: { t: 'number', min: 0, max: 100 }, focusY: { t: 'number', min: 0, max: 100 },
            zoomSp: { t: 'number', min: 1, max: 3 }, focusYPc: { t: 'number', min: 0, max: 100 }, focusXSp: { t: 'number', min: 0, max: 100 }, zoomPc: { t: 'number', min: 1, max: 3 },
            origin: { t: 'string', enum: ['ai_generated', 'stock', 'own_photo', 'unknown'] }, fictional: { t: 'bool' },
            source: str(200),
          },
          required: ['dataUri', 'alt', 'caption'],
        },
      },
      required: [],
    },
  },
  required: ['schemaVersion', 'id', 'name', 'display', 'brand', 'inputs', 'ledger', 'evidence', 'sections', 'cta'],
};

function walk(spec, value, path, ctx) {
  if (value === null && spec.nullable) return null;
  switch (spec.t) {
    case 'string': {
      if (typeof value !== 'string') { ctx.errors.push(`${path}: 文字列ではありません`); return undefined; }
      const v = stripControl(value);
      if (v.length > spec.max) { ctx.errors.push(`${path}: ${spec.max}文字を超えています`); return undefined; }
      if (spec.enum && !spec.enum.includes(v)) { ctx.errors.push(`${path}: 許可されない値 "${v.slice(0, 40)}"`); return undefined; }
      if (spec.pattern && !spec.pattern.test(v)) { ctx.errors.push(`${path}: 形式が不正です`); return undefined; }
      if (/<\s*\/?\s*[a-z!]|javascript:/i.test(v)) ctx.warnings.push(`${path}: HTML/スクリプトらしき文字列があります（テキストとして扱い、実行しません）`);
      return v;
    }
    case 'number': {
      if (typeof value !== 'number' || !Number.isFinite(value)) { ctx.errors.push(`${path}: 数値ではありません`); return undefined; }
      if (spec.int && !Number.isInteger(value)) { ctx.errors.push(`${path}: 整数ではありません`); return undefined; }
      if (spec.min != null && value < spec.min) { ctx.errors.push(`${path}: ${spec.min}未満です`); return undefined; }
      if (spec.max != null && value > spec.max) { ctx.errors.push(`${path}: ${spec.max}を超えています`); return undefined; }
      return value;
    }
    case 'bool':
      if (typeof value !== 'boolean') { ctx.errors.push(`${path}: true/false ではありません`); return undefined; }
      return value;
    case 'array': {
      if (!Array.isArray(value)) { ctx.errors.push(`${path}: 配列ではありません`); return undefined; }
      if (spec.max != null && value.length > spec.max) { ctx.errors.push(`${path}: 要素が${spec.max}件を超えています`); return undefined; }
      if (spec.min != null && value.length < spec.min) { ctx.errors.push(`${path}: 要素が${spec.min}件未満です`); return undefined; }
      const out = [];
      value.forEach((item, i) => {
        const v = walk(spec.of, item, `${path}[${i}]`, ctx);
        if (v !== undefined) out.push(v);
      });
      return out;
    }
    case 'object': {
      if (typeof value !== 'object' || value === null || Array.isArray(value)) { ctx.errors.push(`${path}: オブジェクトではありません`); return undefined; }
      const out = {};
      for (const key of Object.keys(value)) {
        if (DANGEROUS_KEYS.has(key)) { ctx.errors.push(`${path}.${key}: 禁止キーです`); continue; }
        if (!Object.prototype.hasOwnProperty.call(spec.fields, key)) { ctx.warnings.push(`${path}.${key}: 未知のキーを削除しました`); continue; }
        const v = walk(spec.fields[key], value[key], `${path}.${key}`, ctx);
        if (v !== undefined) out[key] = v;
      }
      for (const key of spec.required || []) {
        if (!(key in value)) ctx.errors.push(`${path}.${key}: 必須項目がありません`);
      }
      return out;
    }
    default:
      ctx.errors.push(`${path}: schema 定義エラー`);
      return undefined;
  }
}

function validateShape(spec, value, path = '$') {
  const ctx = { errors: [], warnings: [] };
  const out = walk(spec, value, path, ctx);
  return { value: out, errors: ctx.errors, warnings: ctx.warnings };
}

// ---------------- 移行 ----------------

const V1_ROLE = { fv: 'hero', empathy: 'empathy', reframe: 'empathy', origin: 'mechanism', steps: 'process', scope: 'scope', recommit: 'closing', proof: 'proof', fit: 'fit', closing: 'closing' };
const V1_EVIDENCE_KIND = { policy: 'service-spec', 'internal-data': 'outcome-aggregate', 'customer-consent': 'customer-quote', url: 'third-party', document: 'third-party', other: 'hypothesis' };

function v1ToV2(p) {
  const b = p.brief || {};
  const val = (k) => (b[k] && typeof b[k] === 'object' ? String(b[k].value || '') : '');
  const ok = (k) => !!(b[k] && b[k].status === 'confirmed' && b[k].value);
  const ledger = [];
  const add = (id, k, kind) => { if (val(k)) ledger.push({ id, text: val(k), kind: ok(k) ? kind : 'unknown', reality: 'unknown', origin: `v1 brief.${k}` }); };
  add('v1-audience', 'audience', 'provider-claim');
  add('v1-problem', 'problem', 'provider-claim');
  add('v1-promise', 'promise', 'provider-claim');
  add('v1-offer', 'offer', 'provider-claim');
  const seenRoles = new Set();
  const sections = [];
  for (const s of p.sections || []) {
    const role = V1_ROLE[s.type];
    if (!role || (seenRoles.has(role) && ['hero', 'closing'].includes(role))) continue;
    seenRoles.add(role);
    const f = s.fields || {};
    sections.push({
      id: String(s.id || role).slice(0, 40), role, approved: false, approvedHash: '', needsReview: true, origin: 'migrated',
      heading: String(f.heading || '').slice(0, 120), headingPhrases: [],
      body: [f.lead, f.body].filter(Boolean).join('\n').slice(0, 1200), note: String(f.note || '').slice(0, 200),
      sourceRefs: [], items: [...(f.items || []), ...(f.itemsAlt || [])].slice(0, 10).map((t) => ({ heading: String(t).slice(0, 120), body: '', sourceRefs: [] })),
      visual: null, cta: null, commercialPreview: null,
    });
  }
  return {
    schemaVersion: 2, id: p.id, name: p.name || 'v1から移行したLP', updatedAt: p.updatedAt || '',
    display: { brandName: val('product').slice(0, 40), serviceDescriptor: '', audienceLabel: val('audience').slice(0, 60), demoMode: 'prototype', demoNotice: '試作のページです。お申し込みは受け付けていません。', operator: val('operator').slice(0, 80), category: ['general', 'education', 'health', 'beauty', 'finance', 'employment'].includes(b.category) ? b.category : 'general' },
    brand: p.brand,
    inputs: {
      scene: { who: val('audience'), timing: '', trying: '', stuckAt: val('problem') },
      efforts: {}, promiseLayers: { canDo: [], expectedChange: [], cannotGuarantee: [] }, mechanism: {},
      action: { ctaLabel: val('ctaLabel'), behavior: 'external-booking', url: val('ctaUrl'), price: val('price'), duration: '', method: '', continuation: '', requiredInput: '', confirmed: { offer: ok('offer'), price: ok('price'), duration: false, method: false, url: ok('ctaUrl') } },
      doNotAssert: [],
    },
    ledger,
    quotes: [],
    evidence: (p.evidence || []).map((e) => ({
      id: e.id, claim: e.claim, kind: V1_EVIDENCE_KIND[e.sourceType] || 'hypothesis', reality: 'unknown', source: e.source || '', scope: '', consent: false, checkedAt: '',
      status: 'unverified', verifiedBy: '', verifiedAt: '', verifiedHash: '', provenance: e.provenance === 'seed' ? 'seed' : (e.provenance || 'human'),
      metricValue: e.metricValue ?? null, metricUnit: e.metricUnit || '', metricTarget: '', metricPeriod: '', metricDenominator: '', metricDefinition: '', note: e.note || '',
    })),
    insights: [], angles: [], chosenAngleId: '', sections, selfCheck: null,
    cta: p.cta, lpo: p.lpo || { dataset: null },
  };
}

function migrate(input) {
  if (typeof input !== 'object' || input === null || Array.isArray(input)) return { value: input, notes: [] };
  const notes = [];
  let p = input;
  if (p.schemaVersion === undefined) {
    p = { ...p, schemaVersion: 1 };
    if (p.brief && typeof p.brief === 'object') {
      const brief = {};
      for (const [k, v] of Object.entries(p.brief)) {
        if (DANGEROUS_KEYS.has(k)) continue;
        brief[k] = typeof v === 'string' && k !== 'category' ? { value: v, status: v.trim() ? 'unconfirmed' : 'missing' } : v;
      }
      p.brief = brief;
    }
    notes.push('v0 → v1 に移行しました（ブリーフ値はすべて「未確認」扱い）');
  }
  if (p.schemaVersion === 1) {
    p = v1ToV2(p);
    notes.push('v1 → v2 に移行しました。セクションは「要再確認・未承認」、根拠は「未検証」になります。インサイトと訴求は空なので、生成から作り直してください');
  }
  return { value: p, notes };
}

// ---------------- 意味の検証 ----------------

function validateProject(input) {
  const migrated = migrate(input);
  const warnings = [...migrated.notes];
  const raw = migrated.value;
  if (typeof raw !== 'object' || raw === null || Array.isArray(raw)) {
    return { ok: false, errors: ['$: project はオブジェクトである必要があります'], warnings, project: null };
  }
  if (raw.schemaVersion !== SCHEMA_VERSION) {
    return { ok: false, errors: [`$.schemaVersion: 未対応の版です（${String(raw.schemaVersion).slice(0, 10)}）。対応: ${SCHEMA_VERSION}`], warnings, project: null };
  }
  const shape = validateShape(PROJECT_SPEC, raw);
  const errors = [...shape.errors];
  warnings.push(...shape.warnings);
  const p = shape.value;
  if (errors.length || !p) return { ok: false, errors, warnings, project: null };

  p.display = { demoNotice: '', operator: '', category: 'general', ...p.display };
  p.inputs = {
    scene: {}, efforts: {}, promiseLayers: { canDo: [], expectedChange: [], cannotGuarantee: [] }, mechanism: {},
    action: { confirmed: {} }, doNotAssert: [], ...p.inputs,
  };
  p.inputs.action = { ctaLabel: '', behavior: 'none', url: '', price: '', duration: '', method: '', continuation: '', requiredInput: '', ...p.inputs.action, confirmed: { offer: false, price: false, duration: false, method: false, url: false, ...(p.inputs.action.confirmed || {}) } };
  p.inputs.promiseLayers = { canDo: [], expectedChange: [], cannotGuarantee: [], ...p.inputs.promiseLayers };
  p.quotes = p.quotes || [];
  p.insights = p.insights || [];
  p.angles = p.angles || [];
  p.chosenAngleId = p.chosenAngleId || '';
  if (p.selfCheck === undefined) p.selfCheck = null;
  if (p.fvDesign === undefined) p.fvDesign = null;
  p.publicSources = (p.publicSources || []).filter((x) => {
    if (/^https:\/\//.test(x.url)) return true;
    warnings.push(`$.publicSources.${x.id}: https の URL だけを記録します`);
    return false;
  });
  if (p.fvDesign) {
    p.fvDesign = { viewportFirst: 'sp', visualRole: '', gaze: 'none', fit: '', maxChars: 80, primaryCtas: 1, requiredAssets: [], researchNotes: [], evaluationPlan: '', ...p.fvDesign };
    // 出典の無い「研究」は仮説として扱う
    p.fvDesign.researchNotes = p.fvDesign.researchNotes.map((n) => ({ source: '', caveat: '', ...n, status: n.status === 'research' && !String(n.source || '').trim() ? 'hypothesis' : n.status }));
  }

  if (p.inputs.action.url && !safeUrl(p.inputs.action.url)) {
    warnings.push('$.inputs.action.url: 許可されないURLのため除去しました（https / mailto / tel / #id のみ）');
    p.inputs.action.url = '';
    p.inputs.action.confirmed.url = false;
  }
  if (p.display.demoMode !== 'live' && !p.display.demoNotice.trim()) {
    p.display.demoNotice = p.display.demoMode === 'synthetic-demo' ? '架空サービスのデモです。お申し込みは受け付けていません。' : '試作のページです。お申し込みは受け付けていません。';
    warnings.push('$.display.demoNotice: デモ表示が空のため既定の文を入れました');
  }
  for (const k of ['primary', 'accent', 'ink', 'paper']) {
    if (!safeColor(p.brand[k])) errors.push(`$.brand.${k}: 色は #RRGGBB 形式のみ`);
    else p.brand[k] = safeColor(p.brand[k]);
  }
  for (const [i, v] of p.cta.variants.entries()) {
    if (!safeColor(v.color)) errors.push(`$.cta.variants[${i}].color: 色は #RRGGBB 形式のみ`);
    else v.color = safeColor(v.color);
    if (v.timing === 'always') { v.timing = 'spec'; warnings.push(`$.cta.variants.${v.id}.timing: "always" は廃止。仕様どおりに置き換えました`); }
  }
  if (!p.cta.variants.some((v) => v.id === p.cta.activeVariant)) p.cta.activeVariant = p.cta.variants[0].id;

  const uniq = (list, label, key = 'id') => {
    const seen = new Set();
    for (const item of list) {
      if (seen.has(item[key])) errors.push(`${label}: ID "${item[key]}" が重複しています`);
      seen.add(item[key]);
    }
    return seen;
  };
  const ledgerIds = uniq(p.ledger, '$.ledger');
  const evIds = uniq(p.evidence, '$.evidence');
  const quoteIds = uniq(p.quotes, '$.quotes');
  const sectionIds = uniq(p.sections, '$.sections');
  uniq(p.insights, '$.insights');
  uniq(p.angles, '$.angles');
  uniq(p.cta.variants, '$.cta.variants');
  const allRefs = new Set([...ledgerIds, ...evIds, ...quoteIds]);
  for (const id of ledgerIds) if (evIds.has(id)) errors.push(`ID "${id}" が台帳と根拠で重複しています`);

  // 顧客の原文: 生成由来は入れない
  p.quotes = p.quotes.filter((q) => {
    if (q.provenance === 'claude-code' || q.provenance === 'template') { warnings.push(`$.quotes.${q.id}: 生成由来の文は顧客の原文として扱えないため削除しました`); return false; }
    return true;
  });

  // 根拠: 数値と単位、検証の要件
  const today = new Date().toISOString().slice(0, 10);
  for (const e of p.evidence) {
    e.consent = !!e.consent;
    for (const k of ['scope', 'checkedAt', 'verifiedBy', 'verifiedAt', 'verifiedHash', 'metricUnit', 'metricTarget', 'metricPeriod', 'metricDenominator', 'metricDefinition', 'note']) e[k] = e[k] || '';
    if (e.metricValue === undefined) e.metricValue = null;
    if (e.metricValue != null && !metricMatches(e.claim, e.metricValue, e.metricUnit)) {
      warnings.push(`$.evidence.${e.id}.metricValue: 主張文に「${e.metricValue}${e.metricUnit.split('/')[0]}」が無いため数値を外しました`);
      e.metricValue = null;
    }
    if (e.status !== 'verified') continue;
    let why = null;
    if (!e.verifiedBy.trim()) why = '確認者が無い';
    else if (!isRealDate(e.verifiedAt) || e.verifiedAt > today) why = '確認日が実在しないか未来';
    else if (e.provenance === 'template' || e.provenance === 'claude-code') why = '生成由来の根拠は人が検証し直す必要がある';
    else if (e.verifiedHash !== evidenceHash(e)) why = '検証後に内容が変わっている';
    if (why) {
      e.status = 'unverified'; e.verifiedBy = ''; e.verifiedAt = ''; e.verifiedHash = '';
      warnings.push(`$.evidence.${e.id}: ${why}ため unverified に降格しました`);
    }
  }

  // インサイト: 顧客の原文・観察に基づかない限り hypothesis
  for (const ins of p.insights) {
    const supported = ins.sourceRefs.some((r) => quoteIds.has(r) || p.ledger.some((l) => l.id === r && (l.kind === 'customer-observation' || l.kind === 'customer-quote') && l.reality === 'real'));
    if (ins.status === 'supported' && !supported) { ins.status = 'hypothesis'; warnings.push(`$.insights.${ins.id}: 実在の顧客の原文・観察に基づかないため仮説に戻しました`); }
    for (const r of ins.sourceRefs) if (!allRefs.has(r)) warnings.push(`$.insights.${ins.id}: 参照 "${r}" が台帳にありません`);
  }
  if (p.chosenAngleId && !p.angles.some((a) => a.id === p.chosenAngleId)) { warnings.push('$.chosenAngleId: 存在しない訴求のため外しました'); p.chosenAngleId = ''; }

  // 顔写真（承認 hash に含めるため、セクションより先に整える）
  p.assets = { heroPortrait: null, ...(p.assets || {}) };
  const hp = p.assets.heroPortrait;
  if (hp) {
    p.assets.heroPortrait = { gaze: 'left', flip: false, focusX: 50, focusY: 30, zoomSp: 1, zoomPc: 1, origin: 'unknown', fictional: false, source: '', ...hp }; // 由来と架空かどうかは明示が必要（既定は「不明・架空ではない」= デモでは停止）
    if (!/架空|イメージ/.test(hp.caption)) { p.assets.heroPortrait.caption = '写真はイメージ（架空の人物）'; warnings.push('$.assets.heroPortrait.caption: 架空のイメージ人物である表示に置き換えました'); }
  }
  // セクション
  for (const s of p.sections) {
    s.approved = !!s.approved; s.approvedHash = s.approvedHash || ''; s.needsReview = !!s.needsReview; s.origin = s.origin || 'manual';
    for (const k of ['heading', 'body', 'sub', 'note']) s[k] = s[k] || '';
    s.headingPhrases = s.headingPhrases || []; s.sourceRefs = s.sourceRefs || [];
    s.items = (s.items || []).map((it) => ({ heading: it.heading || '', body: it.body || '', sourceRefs: it.sourceRefs || [] }));
    if (s.visual === undefined) s.visual = null;
    if (s.visual) s.visual = { title: '', task: '', from: '', to: '', review: '', columns: [], rows: [], highlight: -1, sourceRefs: [], ...s.visual, notEvidence: true };
    if (s.cta === undefined) s.cta = null;
    if (s.cta && !sectionIds.has(s.cta.target)) { warnings.push(`$.sections.${s.id}.cta: 移動先 "${s.cta.target}" が無いため外しました`); s.cta = null; }
    if (s.commercialPreview === undefined) s.commercialPreview = null;
    if (s.commercialPreview) s.commercialPreview = { note: '', ...s.commercialPreview };
    if (s.approved && s.approvedHash !== sectionHash(s, p.assets?.heroPortrait)) {
      s.approved = false; s.approvedHash = '';
      warnings.push(`$.sections.${s.id}: 承認後に内容が変わっているため承認を外しました`);
    }
  }
  for (const [i, x] of (p.lpo?.dataset?.experiments || []).entries()) {
    for (const k of ['start', 'end', 'plannedEnd']) if (!isRealDate(x[k])) errors.push(`$.lpo.dataset.experiments[${i}].${k}: 実在しない日付です`);
  }
  if (!p.lpo) p.lpo = { dataset: null };
  if (p.lpo.dataset === undefined) p.lpo.dataset = null;
  if (p.lpo.dataset && p.lpo.dataset.fictional !== true) errors.push('$.lpo.dataset.fictional: このツールは架空データのみ扱います（fictional: true が必要）');
  return { ok: errors.length === 0, errors, warnings, project: errors.length ? null : p };
}

function parseProjectJson(text) {
  if (typeof text !== 'string') return { ok: false, errors: ['入力が文字列ではありません'], warnings: [], project: null };
  const bytes = new TextEncoder().encode(text).length;
  if (bytes > MAX_JSON_BYTES) return { ok: false, errors: [`JSONが大きすぎます（${bytes} bytes > ${MAX_JSON_BYTES}）`], warnings: [], project: null };
  const trimmed = text.trim();
  if (/^</.test(trimmed)) return { ok: false, errors: ['HTMLは読み込めません。project JSON だけを受け付けます'], warnings: [], project: null };
  let data;
  try {
    data = JSON.parse(trimmed, (key, value) => {
      if (DANGEROUS_KEYS.has(key)) throw new Error(`禁止キー "${key}" を含んでいます`);
      return value;
    });
  } catch (e) {
    return { ok: false, errors: [`JSONとして読めません: ${String(e.message).slice(0, 120)}`], warnings: [], project: null };
  }
  return validateProject(data);
}

function serializeProject(project) {
  return JSON.stringify(project, null, 2);
}

/** 参照IDで台帳・根拠・原文を引く */
function refIndex(project) {
  const map = new Map();
  for (const l of project.ledger) map.set(l.id, { type: 'ledger', text: l.text, kind: l.kind, reality: l.reality, item: l });
  for (const e of project.evidence) map.set(e.id, { type: 'evidence', text: e.claim, kind: e.kind, reality: e.reality, item: e });
  for (const q of project.quotes) map.set(q.id, { type: 'quote', text: q.text, kind: 'customer-quote', reality: 'real', item: q });
  for (const ps of project.publicSources || []) map.set(ps.id, { type: 'public', text: ps.observation, kind: ps.kind, reality: 'public', item: ps });
  const a = project.inputs.action;
  for (const k of ['price', 'duration', 'method', 'continuation']) {
    if (a[k] && a.confirmed[k]) map.set(`action.${k}`, { type: 'action', text: a[k], kind: 'verified-spec', reality: project.display.demoMode === 'live' ? 'real' : 'synthetic', item: a });
  }
  return map;
}

return { validateShape, migrate, validateProject, parseProjectJson, serializeProject, refIndex, SCHEMA_VERSION, MAX_JSON_BYTES, DEMO_MODES, CATEGORIES, LEDGER_KINDS, REALITY, EVIDENCE_KINDS, EVIDENCE_STATUS, PROVENANCE, ORIGINS, CONFIDENCE, ACTION_BEHAVIORS, CTA_BEHAVIORS, VISUAL_KINDS, CTA_TIMINGS, METRIC_UNITS, FONTS, DATASET_SPEC, VISUAL_SPEC, SECTION_SPEC, PROJECT_SPEC };
})();

__mods.editorial = (() => {
// 編集上の検査と公開判定（v2）。
// 公開判定は2段:
//   reviewPreview   … レビュー用に安全に描画できる（重大な停止条件が無い。CTA は実行されない）
//   commercialReady … 実販売向けに公開準備が整っている（live・条件確定・全承認・実在の根拠）
// 「verified」や seed の有無だけで事実性・公開可否を決めない。

const { refIndex } = __mods.schema;
const { ROLES } = __mods.roles;
const { canon, containsToken, detectClaims, metricMatches, PLACEHOLDER_RE } = __mods.claims;
const { headingPhrases } = __mods.segment;
const { safeUrl } = __mods.util;
const TOKEN_RE = /\{\{[^}]*\}\}/;
const NUMBER_RE = /[0-9０-９][0-9０-９.,，．]*\s*(?:万|億)?(?:人|名|社|件|%|％|割|倍|円|年|ヶ月|か月|カ月|日間|日|時間|分|位|回|点)/g;
const DURATION = /(?:分|時間|日間|か月|ヶ月|週間)/;
const DURATION_Q = /[0-9０-９〇一二三四五六七八九十百]+\s*(?:分|時間|日間|か月|ヶ月|週間)/;
const COUNT_Q = /[0-9０-９〇一二三四五六七八九十百]+\s*(?:人|名|ユーザー|アカウント|席)/;
const PRICE = /(?:円|無料|0円|ゼロ円|割引|半額|税込|税抜)/;
const COUNT = /(?:人|名|ユーザー|アカウント|席)/;
const ATTR_TYPES = [
  { re: /(所要時間|時間|期間|日数)$/, type: 'duration', test: DURATION_Q },
  { re: /(料金|価格|費用|金額|販売価格)$/, type: 'price', test: PRICE },
  { re: /(人数|上限|ユーザー数上限|ユーザー数)$/, type: 'count', test: COUNT_Q },
];
const SYNONYMS = [['面談', '相談', 'カウンセリング', '打ち合わせ'], ['料金', '価格', '費用', '金額'], ['申込', '申し込み', '予約', '登録']];

function synonymsOf(word) {
  const g = SYNONYMS.find((s) => s.includes(word));
  return g || [word];
}

function clauses(text) {
  return String(text ?? '').split(/[、。！？!?\n]/).map((s) => s.trim()).filter(Boolean);
}

/** 公開用コピーを、参照IDつきで列挙する */
function collectTexts(project) {
  const out = [];
  const d = project.display;
  for (const k of ['brandName', 'serviceDescriptor', 'audienceLabel', 'productLabel']) if (d[k]) out.push({ sectionId: null, role: 'display', field: `display.${k}`, text: d[k], refs: [] });
  for (const s of project.sections) {
    const base = s.sourceRefs || [];
    const itemRefs = s.items.flatMap((i) => i.sourceRefs || []);
    const push = (field, text, refs = []) => { if (text && String(text).trim()) out.push({ sectionId: s.id, role: s.role, field, text: String(text), refs: [...new Set([...refs, ...base])] }); };
    push('heading', s.heading, [...itemRefs, ...(s.visual?.sourceRefs || [])]); // 見出しは項目・図の参照もあわせて判断
    push('body', s.body);
    push('sub', s.sub);
    push('note', s.note);
    s.items.forEach((it, i) => { push(`items[${i}].heading`, it.heading, it.sourceRefs); push(`items[${i}].body`, it.body, it.sourceRefs); });
    if (s.visual) {
      const v = s.visual;
      for (const k of ['title', 'task', 'from', 'to', 'review', 'note']) push(`visual.${k}`, v[k], v.sourceRefs);
      (v.rows || []).forEach((row, i) => push(`visual.rows[${i}]`, row.join(' / '), v.sourceRefs));
    }
    if (s.cta) push('cta.label', s.cta.label);
    if (s.commercialPreview) { push('commercialPreview.label', s.commercialPreview.label); push('commercialPreview.note', s.commercialPreview.note); }
  }
  // 固定CTAの文言案も公開される文言。FV と締めの参照で裏づける
  const ctaRefs = project.sections.filter((s) => s.role === 'hero' || s.role === 'closing').flatMap((s) => s.sourceRefs || []);
  for (const v of project.cta?.variants || []) if (v.label?.trim()) out.push({ sectionId: null, role: 'cta', field: `cta.variants.${v.id}`, text: v.label, refs: [...new Set(ctaRefs)] });
  return out;
}

function unknownAttributes(project) {
  const res = [];
  for (const l of project.ledger.filter((x) => x.kind === 'unknown')) {
    const t = l.text.trim();
    for (const a of ATTR_TYPES) {
      const m = t.match(a.re);
      if (!m) continue;
      const subject = t.slice(0, m.index).replace(/の$/, '').trim();
      res.push({ id: l.id, text: t, subject, type: a.type, test: a.test });
      break;
    }
  }
  return res;
}

const ISSUE = (level, code, message, where = {}) => ({ level, code, message, ...where });

/**
 * 編集上の検査。level: stop（重大な停止条件）/ warn（要確認）/ info
 */
function checkProject(project) {
  const issues = [];
  const idx = refIndex(project);
  const texts = collectTexts(project);
  const unknowns = unknownAttributes(project);
  const doNot = (project.inputs.doNotAssert || []).filter(Boolean);
  const quantities = new Map(); // subject|type → Set(values)

  for (const t of texts) {
    const where = { sectionId: t.sectionId, field: t.field };
    const label = t.role === 'display' ? `表示名/${t.field.slice(8)}` : `${ROLES[t.role]?.label || t.role}/${t.field}`;
    if (TOKEN_RE.test(t.text)) issues.push(ISSUE('stop', 'token', `${label}: 未展開の差込「${t.text.match(TOKEN_RE)[0]}」があります`, where));
    if (PLACEHOLDER_RE.test(t.text)) issues.push(ISSUE('stop', 'placeholder', `${label}: 【要記入】が残っています`, where));
    const refTexts = [];
    const refHits = [];
    for (const r of t.refs) {
      const hit = idx.get(r);
      if (!hit) { issues.push(ISSUE('stop', 'ref-missing', `${label}: 参照ID「${r}」が台帳にありません`, where)); continue; }
      if (hit.type === 'public') { issues.push(ISSUE('stop', 'public-as-evidence', `${label}: 公開資料「${hit.item.title || hit.item.id}」を LP の根拠にしています（公開体験・競合資料は課題理解とインサイト仮説だけに使う）`, where)); continue; }
      if (hit.type === 'ledger' && hit.kind === 'unknown') issues.push(ISSUE('stop', 'unknown-as-fact', `${label}: 不明な項目「${hit.text}」を根拠にしています`, where));
      if (hit.type === 'evidence' && hit.kind === 'outcome-aggregate' && hit.reality !== 'real') issues.push(ISSUE('stop', 'synthetic-outcome', `${label}: 合成・未確認の成果データ「${hit.text.slice(0, 30)}」を根拠にしています（成果としては出せません）`, where));
      refTexts.push(hit.text);
      refHits.push(hit);
    }
    const refJoined = refTexts.join('\n');
    // 数値は参照先にあること
    const ct = canon(t.text);
    for (const m of ct.matchAll(NUMBER_RE)) {
      const tok = m[0];
      if ((ct[m.index - 1] === '月' && /[0-9]/.test(ct[m.index - 2] || '')) || /^[0-9]{1,2}月[0-9]{1,2}日/.test(ct.slice(m.index))) continue; // 日付（10月8日）は数量の主張ではない（「月4.2日」は数量）
      if (!refTexts.some((rt) => containsToken(rt, tok))) { issues.push(ISSUE('stop', 'number-unsupported', `${label}: 数値「${tok}」が参照した事実にありません`, where)); continue; }
      // 指標つきの根拠と同じ数値なら、単位・期間（X/Y）まで一致すること（週4.2日 ≠ 月4.2日 ≠ 4.2時間）
      const num = parseFloat(tok.replace(/[^0-9.]/g, ''));
      for (const h of refHits.filter((x) => x.type === 'evidence' && x.item.metricValue === num && x.item.metricUnit)) {
        if (!metricMatches(t.text, h.item.metricValue, h.item.metricUnit)) issues.push(ISSUE('stop', 'metric-mismatch', `${label}: 「${tok}」は根拠「${h.item.id}」の単位（${h.item.metricUnit}）と対象が合いません`, where));
      }
    }
    // 未確定の条件を別の数値で埋めていないか（例: 学習の15分を面談の15分にする）
    const cls = clauses(t.text);
    const subjOf = (u, cc) => (u.subject ? synonymsOf(u.subject).some((w) => cc.includes(canon(w))) : true);
    const filled = new Set();
    cls.forEach((c, i) => {
      const cc = canon(c);
      for (const u of unknowns) {
        if (filled.has(u.id)) continue;
        if (subjOf(u, cc) && u.test.test(cc)) { filled.add(u.id); issues.push(ISSUE('stop', 'unknown-filled', `${label}: 「${u.text}」は未確定なのに「${c}」と書いています（別の数値や条件で埋めない）`, where)); continue; }
        // 読点で分けても同じ（「面談は、15分です。」）: 前の節が対象を言い、この節が対象を言い換えずに数量だけを述べる
        const prev = i > 0 ? canon(cls[i - 1]) : '';
        const ownNouns = (cc.replace(/[0-9０-９.]+\s*(分間|分|時間|日|円|万円|回|人|%|％)?/g, ' ').match(/[\p{Script=Han}\p{Script=Katakana}ー]{2,}/gu) || []);
        if (prev && subjOf(u, prev) && u.test.test(cc) && ownNouns.length === 0) { filled.add(u.id); issues.push(ISSUE('stop', 'unknown-filled', `${label}: 「${u.text}」は未確定なのに「${cls[i - 1]}、${c}」と書いています（別の数値や条件で埋めない）`, where)); }
      }
    });
    for (const c of cls) {
      const cc = canon(c);
      // 同じ対象に別々の数値が付いていないか
      for (const m of cc.matchAll(NUMBER_RE)) {
        const words = cc.replace(m[0], ' ').match(/[\p{Script=Han}\p{Script=Katakana}ー]{2,}/gu) || [];
        const type = DURATION.test(m[0]) ? 'duration' : PRICE.test(m[0]) ? 'price' : COUNT.test(m[0]) ? 'count' : 'other';
        for (const w of words) {
          const key = `${w}|${type}`;
          if (!quantities.has(key)) quantities.set(key, new Map());
          quantities.get(key).set(m[0], label);
        }
      }
    }
    // 根拠の要る主張（最上級・保証・煽り・権威・推薦・オファー・薬機法・参考LP固有値）
    for (const c of detectClaims(t.text, project.display.category)) {
      if (c.category === 'number') continue;
      if (c.severity === 'block') { issues.push(ISSUE('stop', 'claim-blocked', `${label}: ${c.label}「${c.match}」は出せません`, where)); continue; }
      if (!containsToken(refJoined, c.match)) { issues.push(ISSUE('stop', 'claim-unsupported', `${label}: ${c.label}「${c.match}」に裏づけがありません`, where)); continue; }
      // 実販売では、主張の裏づけは実在・検証済みの根拠だけ（提供者の申告・未検証の根拠では出さない）
      const verified = refHits.some((h) => h.type === 'evidence' && h.reality === 'real' && h.item.status === 'verified' && containsToken(h.text, c.match));
      const at = t.text.indexOf(c.match);
      const negated = at >= 0 && /^[^。！？]{0,12}?(ではありません|しません|はしない|ではない|できません)/.test(t.text.slice(at + c.match.length)); // 「保証するものではありません」は主張でなく断り書き
      if (!verified && !negated) issues.push(ISSUE('warn', 'claim-unverified', `${label}: ${c.label}「${c.match}」の裏づけが実在・検証済みの根拠ではありません（実販売では出せません）`, where));
      if (c.category === 'testimonial' && !t.refs.some((r) => idx.get(r)?.type === 'quote')) issues.push(ISSUE('stop', 'invented-quote', `${label}: 顧客の原文が無いのに口コミ・声のような表現「${c.match}」があります`, where));
    }
    for (const d of doNot) if (canon(t.text).includes(canon(d))) issues.push(ISSUE('stop', 'do-not-assert', `${label}: 言わないと決めた「${d}」が入っています`, where));
    // 入力文の貼り付け
    for (const l of project.ledger) {
      if (l.text.length >= 24 && canon(t.text).includes(canon(l.text))) issues.push(ISSUE('warn', 'pasted-input', `${label}: 台帳の文「${l.text.slice(0, 20)}…」をそのまま貼り付けています。読者向けに書き直してください`, where));
    }
    if (t.field === 'body' && !/[。！？」）]$/.test(t.text.trim())) issues.push(ISSUE('warn', 'no-period', `${label}: 文末に句点がありません`, where));
    if (!t.refs.length && ['body', 'heading'].includes(t.field) && !['faq'].includes(t.role)) issues.push(ISSUE('warn', 'no-refs', `${label}: 参照ID（sourceRefs）がありません`, where));
  }
  for (const [key, vals] of quantities) {
    const [word, type] = key.split('|');
    if (type !== 'other' && vals.size > 1) issues.push(ISSUE('stop', 'conflict', `「${word}」に異なる${type === 'duration' ? '時間' : type === 'price' ? '料金' : '数'}が書かれています: ${[...vals.keys()].join(' / ')}`));
  }

  // 構成
  const hero = project.sections.find((s) => s.role === 'hero');
  if (!hero) issues.push(ISSUE('stop', 'no-hero', 'FV（hero）がありません'));
  else if (!hero.heading.trim()) issues.push(ISSUE('stop', 'empty-heading', 'FV の見出し（H1）が空です', { sectionId: hero.id }));
  for (const s of project.sections) if (s.role === 'faq') s.items.forEach((it, i) => { if (!!it.heading.trim() !== !!it.body.trim()) issues.push(ISSUE('warn', 'faq-incomplete', `よくある質問/${i + 1}: 質問と答えの片方が空のため出力しません`, { sectionId: s.id })); });
  if (!project.sections.some((s) => s.role === 'closing')) issues.push(ISSUE('warn', 'no-closing', '締め（closing）がありません'));
  for (const s of project.sections) {
    const hasContent = s.body.trim() || (s.role === 'hero' && s.sub?.trim()) || s.items.some((i) => i.heading || i.body) || s.visual;
    if (!hasContent && s.role !== 'proof') issues.push(ISSUE('warn', 'empty-section', `${ROLES[s.role].label}: 本文が無いため出力しません（見出し・CTAだけを残さない）`, { sectionId: s.id }));
    if (s.heading) {
      const hp = headingPhrases(s.heading, s.headingPhrases);
      if (hp.source === 'fallback-mismatch') issues.push(ISSUE('warn', 'phrases-mismatch', `${ROLES[s.role].label}: 改行候補が見出しと一致しないため自動で区切ります`, { sectionId: s.id }));
      const limit = s.role === 'hero' ? 26 : 32;
      if ([...s.heading].length > limit) issues.push(ISSUE('warn', 'heading-long', `${ROLES[s.role].label}: 見出しが${[...s.heading].length}字です（目安${limit}字以内）`, { sectionId: s.id }));
    }
    if (s.role === 'proof') {
      const ev = s.sourceRefs.map((r) => idx.get(r)).filter(Boolean);
      if (!ev.some((x) => x.type === 'evidence' && x.reality === 'real' && x.item.status === 'verified')) issues.push(ISSUE('warn', 'proof-empty', '根拠セクションに、実在・検証済みの根拠がありません（出力しません）', { sectionId: s.id }));
    }
  }
  if (hero) {
    const heroText = [hero.heading, hero.sub, hero.body].join('\n');
    const d = project.display;
    if (d.brandName && canon(hero.heading).includes(canon(d.brandName))) issues.push(ISSUE('warn', 'brand-in-headline', 'FV見出しにブランド名が入っています（見出しは読者の場面と変化に使う）', { sectionId: hero.id }));
    if (d.audienceLabel && heroText.includes(d.audienceLabel)) issues.push(ISSUE('warn', 'repeat-audience', 'FVで対象者の呼びかけを繰り返しています（呼びかけは1回）', { sectionId: hero.id }));
    // FV は SP 基準で短く: FV 内に出る文字（説明文・注記は FV の下に出るので数えない）
    const fv = fvTextOf(project, hero);
    const max = project.fvDesign?.maxChars || 80;
    if (fv.length > max) issues.push(ISSUE('warn', 'fv-long', `FV の文字が${fv.length}字です（目安${max}字以内。説明は FV の下へ）`, { sectionId: hero.id }));
    // 顔のビジュアルは人が用意する素材。無ければ必要素材として示し、無関係な写真や架空の肩書・証言で埋めない
    const pt = project.assets?.heroPortrait;
    if (!pt) issues.push(ISSUE('warn', 'asset-missing', `必要素材: FV の顔写真（架空・由来明記・対象者に合う場面）が未設定です${project.fvDesign?.requiredAssets?.length ? `（${project.fvDesign.requiredAssets.join(' / ')}）` : ''}`, { sectionId: hero.id }));
    else if (pt.fictional !== true && d.demoMode !== 'live') issues.push(ISSUE('stop', 'portrait-not-fictional', 'デモの顔写真が架空と記録されていません（実在の人物をデモに使わない）', { sectionId: hero.id }));
    if (pt) {
      // 写真を講師・受講生・推薦者・実績と結び付けない（alt と注記も検査する）
      for (const [k, v] of [['alt', pt.alt], ['caption', pt.caption]]) {
        const hit = String(v || '').match(PORTRAIT_ROLE_RE);
        if (hit) issues.push(ISSUE('stop', 'portrait-claim', `FV の写真（${k}）に「${hit[0]}」とあります（人物を講師・受講生・推薦者・実績として紹介しない）`, { sectionId: hero.id }));
      }
      if (pt.origin !== 'ai_generated' && /AI生成/.test(pt.caption)) issues.push(ISSUE('stop', 'portrait-origin-mismatch', 'FV の写真の注記は「AI生成」ですが、由来が AI 生成と記録されていません', { sectionId: hero.id }));
      if (pt.origin === 'ai_generated' && !/AI|イメージ|架空/.test(pt.caption)) issues.push(ISSUE('warn', 'portrait-origin-mismatch', 'AI 生成の写真であることが注記から分かりません', { sectionId: hero.id }));
    }
    // 研究・心理学・CVR を FV の本文で主張しない（設計メモ fvDesign.researchNotes に書く）
    if (/心理学|研究で|研究によ|CVR|離脱率|コンバージョン/.test([heroText, hero.cta?.label, hero.commercialPreview?.label, hero.commercialPreview?.note, d.productLabel].join('\n'))) issues.push(ISSUE('stop', 'research-in-copy', 'FV の本文で研究・心理学・CVR を主張しています（設計メモに書き、効果を約束しない）', { sectionId: hero.id }));
  }
  if (!project.chosenAngleId) issues.push(ISSUE('warn', 'no-angle', '訴求が選ばれていません'));
  if (project.display.demoMode !== 'live' && !project.display.demoNotice.trim()) issues.push(ISSUE('stop', 'demo-unlabelled', 'デモ・試作の表示がありません'));
  for (const ins of project.insights) if (ins.status === 'hypothesis') issues.push(ISSUE('info', 'hypothesis', `インサイト「${ins.statement.slice(0, 30)}…」は仮説です（顧客の原文・観察で未確認）`));
  return issues;
}

/** FV 内に表示される文字（空白を除く）。render の FV と同じ要素を数える */
function fvTextOf(project, hero = project.sections.find((s) => s.role === 'hero')) {
  if (!hero) return '';
  const d = project.display;
  const v = hero.visual;
  const vis = !v ? [] : v.kind === 'table' ? [v.label, v.title, ...(v.columns || []), ...(v.rows || []).flat()] : [v.label, v.title, v.task, v.from, v.to, v.review]; // 描画される欄をすべて数える
  const parts = [d.brandName, d.demoMode !== 'live' ? (d.demoMode === 'synthetic-demo' ? '架空デモ' : '試作') : '', d.productLabel || d.audienceLabel, hero.heading, hero.sub, ...vis, hero.cta?.label, project.assets?.heroPortrait?.caption];
  return parts.filter(Boolean).join('').replace(/\s/g, '');
}

const PORTRAIT_ROLE_RE = /講師|先生|受講生|受講者|合格者|合格|監修|専門家|お客様|利用者|ユーザーの声|の声|体験談|実績|さん|様|氏|代表|スタッフ|社員/;

const EXAMPLE_HOST = /(^|\.)example\.(com|org|net)$/i;

function gates(project, issues = checkProject(project)) {
  const stops = issues.filter((i) => i.level === 'stop');
  const review = { ok: stops.length === 0, reasons: stops.map((s) => s.message) };
  const reasons = [];
  const d = project.display;
  const a = project.inputs.action;
  if (d.demoMode !== 'live') reasons.push(d.demoMode === 'synthetic-demo' ? '架空サービスのデモです' : '試作です');
  if (!String(d.operator || '').trim()) reasons.push('運営者（事業者名）が確認されていません'); // v1 から引き継ぐ商用の必須条件
  if (!review.ok) reasons.push('重大な停止条件があります');
  if (a.behavior === 'none') reasons.push('CTAで何が起きるか（申込・予約など）が決まっていません');
  const labels = { offer: 'オファー', price: '料金', duration: '所要時間', method: '実施方法', url: 'リンク先' };
  for (const [k, label] of Object.entries(labels)) if (!a.confirmed[k]) reasons.push(`${label}が未確定です`);
  const url = safeUrl(a.url);
  if (!url || !url.startsWith('https:')) reasons.push('リンク先が https の確定URLではありません');
  else if (EXAMPLE_HOST.test(new URL(url).hostname)) reasons.push('リンク先が example ドメイン（説明用）です');
  for (const l of project.ledger.filter((x) => x.kind === 'unknown')) reasons.push(`未確定: ${l.text}`);
  if (project.ledger.some((l) => l.reality !== 'real') || project.evidence.some((e) => e.reality !== 'real')) reasons.push('台帳・根拠に実在でない（合成・不明）項目があります');
  for (const s of project.sections) if (!s.approved) reasons.push(`未承認: ${ROLES[s.role].label}`);
  for (const i of issues.filter((x) => x.code === 'claim-unverified')) reasons.push(i.message);
  const v = project.cta.variants.find((x) => x.id === project.cta.activeVariant);
  if (v && v.timing !== 'spec') reasons.push('固定CTAの表示タイミングが比較用の案です（公開は仕様どおりの案だけ）');
  return { reviewPreview: review, commercialReady: { ok: reasons.length === 0, reasons: [...new Set(reasons)] } };
}

return { clauses, collectTexts, checkProject, fvTextOf, gates };

// - 'skeleton'（ルールベース）: 入力から骨組みだけを作る。文章は書かず【要記入】を置く。AI生成ではない。
// - 'claude-code': buildPrompt の指示を Claude Code セッションが読み、JSON を書く → ingestGenerated で検証して取り込む。
//   ブラウザから推論APIは呼ばない。新規APIキー・外部連携なし。
// 生成物は常に「仮説・未承認・未検証」で入る。顧客の原文（quotes）は生成では作れない。

const { ROLES, ROLE_IDS, ANGLE_DEPENDENT } = __mods.roles;

  'claude-code': { id: 'claude-code', label: 'Claude Code 生成（prompt → JSON 受け渡し）', connected: false },
};

const TODO = (what) => `【要記入: ${what}】`;

/** ルールベースの骨組み。コピーは書かない（AI推論ではない）。 */
function skeletonSections(project) {
  const mk = (role, extra = {}) => ({
    id: role, role, approved: false, approvedHash: '', needsReview: false, origin: 'template',
    heading: TODO(`${ROLES[role].label}の見出し`), headingPhrases: [], body: TODO(ROLES[role].purpose), note: '', sourceRefs: [], items: [], visual: null, cta: null, commercialPreview: null, ...extra,
  });
  return [mk('hero'), mk('empathy'), mk('mechanism'), mk('process'), mk('closing')];
}

function applySkeleton(project) {
  const p = clone(project);
  p.sections = skeletonSections(p);
  return p;
}

/** 訴求を選び直す（ルールベース部分）。依存セクションを「要再確認・未承認」にし、無関係な編集は保持する。 */
function chooseAngle(project, angleId) {
  const p = clone(project);
  if (!p.angles.some((a) => a.id === angleId)) throw new Error('訴求が見つかりません');
  if (p.chosenAngleId === angleId) return p;
  p.chosenAngleId = angleId;
  p.sections = p.sections.map((s) => (ANGLE_DEPENDENT.includes(s.role) ? { ...s, needsReview: true, approved: false, approvedHash: '' } : s));
  return p;
}

function dumpInputs(project) {
  const d = project.display;
  const i = project.inputs;
  const L = [];
  L.push('## 表示用の名前（display）');
  L.push(`- brandName: ${d.brandName}`, `- serviceDescriptor: ${d.serviceDescriptor}`, `- audienceLabel: ${d.audienceLabel}`, `- productLabel: ${d.productLabel || '（なし）'}`, `- demoMode: ${d.demoMode}`, `- demoNotice: ${d.demoNotice}`, '');
  L.push('## 事実台帳（id / 種別 / 実在or合成 / 内容）');
  for (const l of project.ledger) L.push(`- ${l.id} [${l.kind} / ${l.reality}] ${l.text}`);
  L.push('');
  L.push('## 根拠（evidence。合成の成果データはLPの根拠に使わない）');
  if (!project.evidence.length) L.push('- （なし）');
  for (const e of project.evidence) L.push(`- ${e.id} [${e.kind} / ${e.reality} / ${e.status}] ${e.claim}`);
  L.push('', '## 顧客の原文（quotes）', project.quotes.length ? project.quotes.map((q) => `- ${q.id} ${q.text}（${q.method} ${q.date}）`).join('\n') : '- （なし。引用・口コミは作らない）', '');
  L.push('## 公開資料（課題理解とインサイト仮説の材料。LP の根拠・口コミ・実績・優位性には使わない。sections の sourceRefs に入れない）');
  if (!(project.publicSources || []).length) L.push('- （なし）');
  for (const ps of project.publicSources || []) L.push(`- ${ps.id} [${ps.kind} / ${ps.use}] ${ps.title} ${ps.url}\n  観察: ${ps.observation}\n  限界: ${ps.caveat}`);
  L.push('');
  L.push('## FV の顔写真（assets.heroPortrait。人が用意する素材。画像そのものは渡さない）');
  const pt = project.assets?.heroPortrait;
  if (!pt) L.push('- なし（必要素材として fvDesign.requiredAssets に書く。無関係な写真・肩書・証言で埋めない）');
  else L.push(`- あり / alt: ${pt.alt} / 注記: ${pt.caption} / 由来: ${pt.origin} / 架空: ${pt.fictional ? 'はい' : 'いいえ'} / 視線: ${pt.gaze === 'right' ? '右' : '左'}向き`, '- 写真の中身について書けるのは alt に書かれたことだけ。人物を講師・受講生・推薦者・実績として紹介しない');
  L.push('');
  L.push('## A 読者と場面');
  for (const [k, v] of Object.entries(i.scene || {})) if (v) L.push(`- ${k}: ${v}`);
  L.push('## B 既存の努力と詰まり');
  for (const [k, v] of Object.entries(i.efforts || {})) if (v) L.push(`- ${k}: ${v}`);
  L.push('## E 商材が担える変化');
  for (const k of ['canDo', 'expectedChange', 'cannotGuarantee']) for (const x of i.promiseLayers[k] || []) L.push(`- ${k}: ${x.text} (${(x.sourceRefs || []).join(', ')})`);
  L.push('## F 仕組み');
  for (const [k, v] of Object.entries(i.mechanism || {})) if (v) L.push(`- ${k}: ${v}`);
  L.push('## H 行動条件（未確定は穴埋めしない）');
  const a = i.action;
  L.push(`- behavior: ${a.behavior} / ctaLabel: ${a.ctaLabel || '（なし）'} / url: ${a.url || '（なし）'}`);
  for (const k of ['price', 'duration', 'method', 'continuation', 'requiredInput']) L.push(`- ${k}: ${a[k] || '（未確定）'}${a.confirmed?.[k] ? '（確定）' : ''}`);
  L.push(`- 確定済み: ${Object.entries(a.confirmed || {}).filter(([, v]) => v).map(([k]) => k).join(', ') || 'なし'}`);
  L.push('## 言わないこと（doNotAssert）');
  for (const x of i.doNotAssert || []) L.push(`- ${x}`);
  return L.join('\n');
}

    angles: [{ id: 'a1', statement: '訴求', insightId: 'i1', sourceRefs: ['s1-...'], rationale: '選んだ・選ばなかった理由', scores: { evidence: 0, fit: 0, specificity: 0, nextAction: 0 } }],
    chosenAngleId: 'a1',
    sections: [{
      id: 'hero', role: 'hero', heading: '', headingPhrases: [''], sub: 'FV の補助文（H1 の問い・場面に、提供内容で答える短い1行）', body: '', note: '', sourceRefs: [],
      items: [{ heading: '', body: '', sourceRefs: [] }],
      visual: { kind: 'task-card', label: '〜のイメージ', title: '', task: '', note: '例であり実物・成果ではない旨', sourceRefs: [] },
      cta: { label: '', behavior: 'anchor', target: 'illustration' },
      commercialPreview: { label: '実際の申込ボタンの文言', note: 'デモのため使えない旨' },
    }],
    fvDesign: { viewportFirst: 'sp', visualRole: '顔写真の役割', gaze: 'toward-copy', fit: '商材・対象者との適合', maxChars: 80, primaryCtas: 1, requiredAssets: ['不足している素材'], researchNotes: [{ claim: '', source: '出典', status: 'research', caveat: '限界' }], evaluationPlan: '将来の比較検証の方法と指標' },

// ---------------- 部品 ----------------

const paras = (text) => String(text || '').split(/\n+/).filter((x) => x.trim()).map((x) => `<p>${e(x)}</p>`).join('');

function phrasesHtml(heading, preferred) {
  const { phrases } = headingPhrases(heading, preferred);
  return phrases.map((p) => `<span class="ph">${e(p)}</span>`).join('');
}

function visualHtml(v, { hero = false } = {}) {
  if (!v) return '';
  const label = `<span class="vis-label">${e(v.label)}</span>`;
  const note = v.note ? `<p class="vis-note">${phrasesHtml(v.note)}</p>` : '';
  if (v.kind === 'task-card' && hero) {
    return `<div class="vis plan">${label}<div class="plan-main"><p class="vis-title plan-title">${e(v.title)}</p></div><div class="vis-row plan-task hl"><span class="vis-box" aria-hidden="true"></span><span>${e(v.task)}</span></div></div>`;
  }
  if (v.kind === 'table' && hero) {
    const cols = v.columns || [];
    const rows = (v.rows || []).map((r, i) => `<tr${i === v.highlight ? ' class="hl"' : ''}>${r.map((c, j) => `<td data-label="${e(cols[j] || '')}">${j === 1 ? `<span class="tag">${e(c)}</span>` : e(c)}</td>`).join('')}</tr>`).join('');
    return `<div class="vis vis-tablebox">${label}<table class="vis-table"><thead><tr>${cols.map((c) => `<th scope="col">${e(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if (v.kind === 'task-card') {
    return `<div class="vis vis-taskcard">${label}${v.title ? `<p class="vis-title">${e(v.title)}</p>` : ''}<div class="vis-row hl"><span class="vis-box" aria-hidden="true"></span><span>${e(v.task)}</span></div>${note}</div>`;
  }
  if (v.kind === 'flow') {
    const steps = [v.from, v.to, v.review].filter(Boolean);
    const html = steps.map((s, i) => `<div class="flow-step${i === 1 ? ' main' : ''}">${phrasesHtml(s)}</div>`).join('<span class="flow-arrow" aria-hidden="true"></span>');
    return `<div class="vis vis-flow">${label}<div class="flow" role="list">${html}</div>${note}</div>`;
  }
  if (v.kind === 'table') {
    const cols = v.columns || [];
    const rows = (v.rows || []).map((r, i) => `<tr${i === v.highlight ? ' class="hl"' : ''}>${r.map((c, j) => `<td data-label="${e(cols[j] || '')}">${j === 1 ? `<span class="tag">${e(c)}</span>` : e(c)}</td>`).join('')}</tr>`).join('');
    return `<div class="vis vis-tablebox">${label}${v.title ? `<p class="vis-filter">${e(v.title)}</p>` : ''}<table class="vis-table"><thead><tr>${cols.map((c) => `<th scope="col">${e(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>${note}</div>`;
  }
  if (v.kind === 'checklist') {
    const items = [v.title, v.task, v.from, v.to, v.review].filter(Boolean);
    return `<div class="vis">${label}<ul class="check-list">${items.map((x, i) => `<li${i === 0 ? ' class="hl"' : ''}><span class="vis-box" aria-hidden="true"></span>${e(x)}</li>`).join('')}</ul>${note}</div>`;
  }
  return '';
}

function ctaHtml(s, mode) {
  if (!s.cta && !s.commercialPreview) return '';
  const parts = [];
  if (s.cta) parts.push(`<a class="btn btn-primary" href="#${e(s.cta.target)}">${e(s.cta.label)}<span class="arw" aria-hidden="true"></span></a>`);
  if (s.commercialPreview) {
    if (mode.commercial) {
      parts.push(`<a class="btn btn-primary" href="${e(mode.commercialUrl)}" rel="noopener noreferrer">${e(s.commercialPreview.label)}<span class="arw" aria-hidden="true"></span></a>`);
    } else {
      parts.push(`<span class="btn btn-disabled" role="link" aria-disabled="true">${e(s.commercialPreview.label)}</span>`);
    }
  }
  const note = !mode.commercial ? (s.commercialPreview?.note || mode.demoNotice) : '';
  return `<div class="cta-row cta-zone">${parts.join('')}</div>${note ? `<p class="cta-note">${phrasesHtml(note)}</p>` : ''}`;
}

function hasContent(s) {
  if (s.role === 'proof') return true; // 出せる根拠があるかは sectionHtml が判断する
  return !!(s.body.trim() || (s.role === 'hero' && (s.sub || '').trim()) || s.items.some((i) => (i.heading || i.body).trim()) || s.visual);
}

function draftMeta(s, mode) {
  if (!mode.draft) return '';
  const refs = [...new Set([...s.sourceRefs, ...s.items.flatMap((i) => i.sourceRefs), ...(s.visual?.sourceRefs || [])])];
  const st = s.approved ? '承認済' : '未承認';
  return `<p class="draft-meta">${e(ROLES[s.role].label)} / ${st}${s.needsReview ? ' / 要再確認' : ''} / 参照: ${e(refs.join(', ') || 'なし')}</p>`;
}

function sectionHtml(project, s, mode) {
  const id = e(s.id);
  const h2 = s.heading ? `<h2>${phrasesHtml(s.heading, s.headingPhrases)}</h2>` : '';
  const meta = draftMeta(s, mode);
  switch (s.role) {
    case 'hero': {
      // FV は 1つの訴求・大きな主役（人物写真 または 計画の図）・1つのCTA。説明・デモの注意書き・実際の申込ボタンは FV の下（after-fv）
      const d = project.display;
      const badge = d.demoMode !== 'live' ? `<span class="demo-badge">${d.demoMode === 'synthetic-demo' ? '架空デモ' : '試作'}</span>` : '';
      const cta = s.cta ? `<a class="btn btn-primary btn-hero" href="#${e(s.cta.target)}">${e(s.cta.label)}<span class="arw" aria-hidden="true"></span></a>` : '';
      const pt = project.assets?.heroPortrait;
      const label = d.productLabel || d.audienceLabel;
      const copy = `<div class="hero-copy">${meta}${label ? `<p class="aud">${e(label)}</p>` : ''}<h1>${phrasesHtml(s.heading, s.headingPhrases)}</h1>${s.sub ? `<p class="hero-sub">${phrasesHtml(s.sub)}</p>` : ''}</div>`;
      if (pt && pt.dataUri) {
        // 顔が主役。写真を全面に敷き、視線（gaze）の先に見出し・小さな計画カード・CTA を置く。人物は架空のイメージで、口コミ・実績・肩書と結び付けない
        const num = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d);
        const vars = `--fx:${num(pt.focusX, 50)}%;--fy:${num(pt.focusY, 30)}%;--fyp:${num(pt.focusYPc, num(pt.focusY, 30))}%;--fxs:${num(pt.focusXSp, num(pt.focusX, 50))}%;--zs:${num(pt.zoomSp, 1)};--zp:${num(pt.zoomPc, 1)}`;
        return `<header class="hero hero-portrait gaze-${pt.gaze === 'right' ? 'right' : 'left'} cta-zone" id="${id}" style="${vars}"><figure class="hero-photo"><img src="${e(pt.dataUri)}" alt="${e(pt.alt)}"${pt.flip ? ' class="flip"' : ''} decoding="async"><figcaption class="photo-cap">${e(pt.caption)}</figcaption></figure><div class="hero-bar"><span class="logo">${e(d.brandName)}</span>${badge}</div><div class="hero-in">
${copy}
${s.visual ? `<div class="hero-visual mini" aria-label="${e(s.visual.label)}">${visualHtml(s.visual, { hero: true })}</div>` : ''}
<div class="hero-cta">${cta}</div>
</div></header>`;
      }
      return `<header class="hero cta-zone" id="${id}"><div class="hero-bar"><span class="logo">${e(d.brandName)}</span>${badge}</div><div class="hero-in">
${copy}
${s.visual ? `<figure class="hero-visual" aria-label="${e(s.visual.label)}">${visualHtml(s.visual, { hero: true })}</figure>` : ''}
<div class="hero-cta">${cta}</div>
</div></header>`;
    }
    case 'closing':
      return `<section class="closing" id="${id}"><div class="sec-in">${meta}${h2}${s.body ? `<div class="body">${paras(s.body)}</div>` : ''}${ctaHtml(s, mode)}</div></section>`;
    case 'process':
      return `<section class="sec sec-process" id="${id}"><div class="sec-in">${meta}${h2}${s.body ? `<div class="body reveal">${paras(s.body)}</div>` : ''}<ol class="steps">${s.items.filter((it) => it.heading || it.body).map((it) => `<li class="reveal"><div>${it.heading ? `<h3>${phrasesHtml(it.heading)}</h3>` : ''}${it.body ? `<p>${e(it.body)}</p>` : ''}</div></li>`).join('')}</ol>${ctaHtml(s, mode)}</div></section>`;
    case 'faq':
      return `<section class="sec sec-faq" id="${id}"><div class="sec-in">${meta}<h2>${s.heading ? phrasesHtml(s.heading, s.headingPhrases) : 'よくある質問'}</h2>${s.body ? `<div class="body">${paras(s.body)}</div>` : ''}<dl class="faq">${s.items.filter((it) => it.heading && it.body).map((it) => `<div class="reveal"><dt>${e(it.heading)}</dt><dd>${e(it.body)}</dd></div>`).join('')}</dl></div></section>`;
    case 'illustration':
      return `<section class="sec sec-illus illus" id="${id}"><div class="sec-in wide">${meta}${h2}${s.body ? `<div class="body">${paras(s.body)}</div>` : ''}<div class="reveal">${visualHtml(s.visual)}</div>${ctaHtml(s, mode)}</div></section>`;
    case 'scope':
      return `<section class="sec sec-scope" id="${id}"><div class="sec-in">${meta}${h2}<div class="scope-box reveal">${paras(s.body)}${s.items.some((it) => it.heading || it.body) ? `<ul>${s.items.filter((it) => it.heading || it.body).map((it) => `<li>${e(it.heading)}${it.heading && it.body ? '：' : ''}${e(it.body)}</li>`).join('')}</ul>` : ''}</div>${ctaHtml(s, mode)}</div></section>`;
    case 'proof': {
      const idx = refIndex(project);
      const ev = s.sourceRefs.map((r) => idx.get(r)).filter((x) => x && x.type === 'evidence' && x.reality === 'real' && x.item.status === 'verified' && !['illustrative', 'hypothesis'].includes(x.item.kind) && !(x.item.kind === 'customer-quote' && !x.item.consent) && ![x.item.claim, x.item.source].some((t) => detectClaims(t, project.display.category).some((c) => c.severity === 'block')));
      if (!ev.length) return '';
      return `<section class="sec sec-proof" id="${id}"><div class="sec-in">${meta}${h2}${s.body ? `<div class="body">${paras(s.body)}</div>` : ''}<ul class="points">${ev.map((x) => `<li class="reveal">${e(x.text)}<br><small>出典: ${e(x.item.source)}</small></li>`).join('')}</ul></div></section>`;
    }
    default: {
      const items = s.items.filter((it) => it.heading || it.body);
      return `<section class="sec sec-${e(s.role)}${s.visual ? ' illus' : ''}" id="${id}"><div class="sec-in${s.visual ? ' wide' : ''}">${meta}${h2}${s.body ? `<div class="body reveal">${paras(s.body)}</div>` : ''}${items.length ? `<ul class="points">${items.map((it) => `<li class="reveal">${it.heading ? `<b>${e(it.heading)}</b>` : ''}${it.body ? e(it.body) : ''}</li>`).join('')}</ul>` : ''}${s.visual ? `<div class="reveal vis-wrap">${visualHtml(s.visual)}</div>` : ''}${ctaHtml(s, mode)}</div></section>`;
    }
  }
}

/**
 * kind: 'draft'（社内確認。役割・参照IDと検査結果を表示）/ 'review'（レビュー用プレビュー。デモ表示・CTAはページ内のみ）/ 'commercial'（実販売。判定が通った場合だけ）
 * options.reduceMotion: true なら動きなしで描画（プレビューの「動きを減らす」）
 */
function renderPage(project, { kind = 'review', reduceMotion = false } = {}) {
  const d = project.display;
  const issues = checkProject(project);
  const g = gates(project, issues);

/**
 * 実験をまたいだ比較の前提。TZ・分母・CV定義・計測条件・ページが全案で一致し、期間が重ならないときだけ comparable。
 * comparable でも、期間の長さ・曜日構成・季節性は調整していない（cautions に出す）。
 */
function comparability(a, b) {
  const reasons = [];
  const cautions = [];
  const uniq = (x, k) => [...new Set(x.variants.map((v) => v[k]))];
  if (a.timezone !== b.timezone) reasons.push(`タイムゾーンが異なる（${a.timezone} / ${b.timezone}）`);
  const labels = { unit: '分母', conversionDefinition: 'コンバージョン定義', measurement: '計測条件' };
  for (const k of Object.keys(labels)) {
    const ua = uniq(a, k);
    const ub = uniq(b, k);
    if (ua.length > 1 || ub.length > 1) reasons.push(`${labels[k]}が実験内の案ごとに異なる`);
    else if (ua[0] !== ub[0]) reasons.push(k === 'unit' ? `分母が異なる（${ua[0]} / ${ub[0]}）` : `${labels[k]}が異なる`);
  }
  if ((a.page || '') !== (b.page || '')) reasons.push('対象ページが異なる');
  const overlap = Date.parse(a.start) <= Date.parse(b.end) && Date.parse(b.start) <= Date.parse(a.end);
  if (overlap) reasons.push('期間が重複している（同じ訪問者が両方に入る）');
  const da = daysBetween(a.start, a.end);
  const db = daysBetween(b.start, b.end);
  if (da !== db) cautions.push(`期間の長さが異なる（${da}日 / ${db}日）`);
  if (da % 7 || db % 7) cautions.push('曜日構成がそろっていない（7日単位でない）');
  cautions.push('季節性・流入構成の変化は未調整');
  return { comparable: reasons.length === 0, reasons, cautions };
}

function priority(impact, confidence, effort) {
  const score = Math.round(((impact * confidence) / effort) * 10) / 10;
  return { score, impact, confidence, effort, level: score >= 4 ? '高' : score >= 2 ? '中' : '低' };
}

/**
 * 仮説と検証計画。evidenceType: observed-fictional（架空集計の観測）/ project-audit（このLPの監査結果）/ heuristic（一般論・未検証）

function buildHypotheses(project, analyses) {
  const H = [];

    `最長 ${LPO_RULES.maxDurationDays} 日で打ち切り（到達しなければ「判定しない」で終える）`,
    `SRM（p<${LPO_RULES.srmP}）を検出したら即停止し、割付・計測を点検`,
    'guardrail のいずれかが対照より悪化し、その95%CIが0をまたがなければ停止',

      id: 'h-proof', title: '根拠セクションを検証済みの事実で埋める', evidenceType: 'project-audit',
      basis: ['LP監査: 実在・検証済みの根拠が 0 件（根拠セクションは出力されない）'],
      hypothesis: '申込を迷う人が判断材料を見つけられず、離脱しているかもしれない。検証済みの事実を足すと申込率が上がる可能性がある',
      metric: `主要: ${cvDef}（分母 ${unit}）`, guardrails: [...guardBase, '問い合わせ内容の質（申込後の不一致が増えていないか）'],
      stopConditions: stopBase, priority: priority(3, 2, 2),
      caution: 'テストの前に、出典を人が確認すること。未検証の数字を出して改善しても、それは改善ではない',
    });
  }
  const conf = project.inputs?.action?.confirmed || {};
  const unconfirmed = ['offer', 'price', 'duration', 'method', 'url'].filter((k) => !conf[k]);
  if (unconfirmed.length) {
    H.push({
      id: 'h-brief', title: 'オファーと行動条件の確定（テスト前の前提づくり）', evidenceType: 'project-audit',
      basis: [`行動条件の未確定: ${unconfirmed.join(', ')}`],
      hypothesis: '申込後に何が起きるかが決まっていない状態でABを回しても、何を比べたのか後から説明できない。先に確定させる',
      metric: '（テストではない。確定作業）', guardrails: [], stopConditions: ['オファー・料金・所要時間・方法・リンク先が確定したら完了'], priority: priority(2, 3, 1),
      caution: 'これは検証計画の前提。結果指標は無い',
    });
  }
  if (main && main.rows.every((r) => r.rate != null)) {
    const cr = main.rows[0];
    if (cr.afterClickOk) {
      const after = cr.conversions / cr.ctaClicks;
      H.push({
        id: 'h-after-click', title: 'CTAクリック後の遷移先を点検する', evidenceType: 'observed-fictional',
        basis: [`${main.name} の対照: CTAクリック ${cr.ctaClicks} に対しCV ${cr.conversions}（クリック後のCV ${pct(after)}）`, '遷移先（LP外）の行動は未計測'],
        hypothesis: 'クリック後に離脱している割合が大きいなら、LP本文より遷移先の摩擦が効いているかもしれない。LP側の変更より先に確認する価値がある',
        metric: `クリック後CV率 = CV / CTAクリック（同一定義・同一期間）`, guardrails: guardBase,
        stopConditions: ['遷移先の計測が無いうちは結論を出さない', ...stopBase.slice(1, 3)], priority: priority(2, after < 0.3 ? 2 : 1, 2),
        caution: '遷移先は計測範囲外。外部分析サービスとは未接続のため、ここでは仮説の提示まで',

  }

    const vs = project.cta.variants.map((v) => `${v.id}: 「${v.label || heroCta}」/ ${v.color} / ${v.timing}`);
    H.push({
      id: 'h-cta', title: 'CTAの文言・色・表示タイミングの比較', evidenceType: 'heuristic',
      basis: ['プレビュー上のCTA案（実配信はしていない）', ...vs],
      hypothesis: '固定CTAの出し方を変えると、本文を読み終える前の誤クリックや見落としが変わるかもしれない',
      metric: `主要: ${cvDef}（分母 ${unit}）。補助: CTAクリック率`, guardrails: [...guardBase, 'クリック率だけ上がりCVが下がっていないか'],
      stopConditions: stopBase, priority: priority(2, 1, 1),
      caution: '一般論からの仮説で、このLPでの観測はまだない。実配信は別途の承認が必要（このツールは配信しない）',
    });
  }
  for (const a of analyses) {
    a.comparisons.forEach((c, idx) => {
      if (c.verdict !== 'difference-observed') return;
      const up = c.relativeLift > 0;
      const variantId = a.rows[idx + 1]?.id || String(idx + 1);
      H.push({
        id: `h-replicate-${a.id}-${variantId}`,
        title: up ? `「${a.name}」の ${c.variant}: 改善の再現確認と段階展開` : `「${a.name}」の ${c.variant}: 悪化の再現確認と配分停止`,
        evidenceType: 'observed-fictional',
        basis: [`${a.period} / 分母 ${a.unit} で対照より${up ? '高い' : '低い'}差が観測された（相対 ${(c.relativeLift * 100).toFixed(1)}%、p=${c.p.toExponential(2)}）`, '一度の観測で、因果の経路と他期間・他流入への汎化は未確認'],
        hypothesis: up
          ? `${c.variant} の変更が申込を増やしたのかもしれない。別期間で同じ定義のまま再現するかを確かめ、再現すれば段階的に配分を上げる`
          : `${c.variant} の変更が申込を減らしたのかもしれない。この案への配分は止め、悪化が再現するかは必要な場合だけ小さく確かめる`,
        metric: `主要: ${a.conversionDefinition}（分母 ${a.unit}）。前回と同じ定義・同じ計測条件で`,
        guardrails: [...guardBase, '申込後の不一致（キャンセル・問い合わせ内容）が増えていないか'],
        stopConditions: up
          ? [`再現テストも各群 ${a.requiredPerArm ?? '必要数'} に到達で判定`, `最長 ${LPO_RULES.maxDurationDays} 日`, `SRM（p<${LPO_RULES.srmP}）で停止`, '再現しなければ展開しない（元に戻す）']
          : ['この案への配分は直ちに 0 にする（再開しない）', `再確認する場合も最長 ${LPO_RULES.maxDurationDays} 日・小配分`, `SRM（p<${LPO_RULES.srmP}）で停止`],
        priority: priority(3, 2, 1),
        caution: 'このツールは配信しない。配分の変更は実配信の承認を別途取ってから',
      });
    });
  }
  if (main) {
    const notEval = main.comparisons.filter((c) => c.verdict === 'not-evaluable');
    if (notEval.length) {
      H.push({
        id: 'h-continue', title: `「${main.name}」は判定せず、条件を満たすまで継続または設計し直す`, evidenceType: 'observed-fictional',
        basis: notEval.flatMap((c) => c.reasons).slice(0, 4),
        hypothesis: '現時点のデータから案の優劣は言えない。必要サンプルに届く見込みがあれば継続、なければMDEを見直す',
        metric: `主要: ${cvDef}（分母 ${unit}）`, guardrails: guardBase,
        stopConditions: [estDays ? `現在の流入なら約 ${estDays} 日で必要サンプルに到達（最長 ${LPO_RULES.maxDurationDays} 日を超えるなら設計を見直す）` : '到達見込みは計算できない', ...stopBase],
        priority: priority(2, 3, 1),
        caution: '途中経過の差を根拠に打ち切らない',

}

function render() {

  const focusId = document.activeElement?.id || null;
  const scrollY = window.scrollY;
  $('#project-name').value = p.name;
  $('#btn-undo').disabled = !state.undo.length;
  $('#btn-redo').disabled = !state.redo.length;

  document.querySelectorAll('[role=tab]').forEach((t) => { const on = t.dataset.tab === state.tab; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });
  const panel = $('#panel');
  panel.setAttribute('aria-labelledby', `tab-${state.tab}`);
  const view = { inputs: renderInputs, insight: renderInsight, plan: renderPlan, design: renderDesign, export: renderExport, cta: renderCta, lpo: renderLpo, gen: renderGen }[state.tab](p);
  panel.replaceChildren(view);
  if (focusId) { const el = document.getElementById(focusId); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }

  });
  $('#btn-load').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file-load').click(); } });
  $('#seed-pick').addEventListener('change', async (e) => { const v = e.target.value; e.target.value = ''; if (!v) return; try { state.selected = null; commit(await loadSeed(v)); toast('架空seedを開きました'); } catch (err) { toast(err.message, 'error'); } });
  $('#btn-new').addEventListener('click', () => { state.selected = null; commit(emptyProject()); toast('新規プロジェクト（入力・台帳から始めてください）'); setTab('inputs'); });
  $('#project-name').addEventListener('change', (e) => edit({ type: 'setName', value: e.target.value }));
  const tabs = [...document.querySelectorAll('[role=tab]')];
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => setTab(t.dataset.tab));
    t.addEventListener('keydown', (e) => {
      let j = null;
      if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
      if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
      if (e.key === 'Home') j = 0;
      if (e.key === 'End') j = tabs.length - 1;
      if (j != null) { e.preventDefault(); setTab(tabs[j].dataset.tab); tabs[j].focus(); }
    });
  });
  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  });
}

async function boot() {
  bindChrome();
  const ui = (() => { try { return JSON.parse(storageGet(UI_KEY) || '{}'); } catch { return {}; } })();
  if (ui.selected) state.selected = ui.selected;
  if (ui.preview && typeof ui.preview === 'object') state.preview = { ...state.preview, ...ui.preview, nonce: 0 };
  const saved = storageGet(AUTOSAVE_KEY);
  const restored = saved ? parseProjectJson(saved) : null;
  if (restored && restored.ok) { state.project = restored.project; toast('前回の編集を復元しました（再開）'); } else {
    try { state.project = await loadSeed('michishirube'); } catch { state.project = emptyProject(); }
    if (saved) toast('前回の保存データが読めなかったため架空seedで開きました', 'error');
  }
  const hashTab = location.hash.slice(1);
  state.tab = TABS.includes(hashTab) ? hashTab : (TABS.includes(ui.tab) ? ui.tab : 'inputs');
  history.replaceState({ tab: state.tab }, '', `#${state.tab}`);
  render();
  document.body.dataset.ready = '1';
}
boot();

return {  };
})();

})();</script>
