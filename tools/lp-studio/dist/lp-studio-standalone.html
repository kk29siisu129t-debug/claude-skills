<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-ncryGUi052b6Wfdx1L9avxfQgsVgMcYnKLhHbNk5EjI=' 'sha256-bkSaI7brBYa8QEfmP5/oHVkW+4oDSKlgGnSJ8I2/h4o='; style-src 'unsafe-inline'; img-src data:; frame-src 'self' about:; child-src 'self' about: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>LP Studio（自己完結版）</title>
<style>:root{--bg:#f4f5f8;--card:#fff;--ink:#1b1f2b;--muted:#5a6172;--line:#d9dde6;--pri:#2741b8;--ok:#1f6f5c;--ng:#a3271b;--warn:#7a4b00;--focus:#ffbf00}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.7;overflow-x:hidden}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,.btn,select,input,textarea{font:inherit;color:inherit}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;line-height:1.3}
button:hover,.btn:hover{border-color:var(--pri)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
button.danger{color:var(--ng)}
input[type=text],input[type=url],input[type=number],input[type=date],textarea,select{width:100%;min-width:0;padding:7px 10px;border:1px solid #b8bfcc;border-radius:8px;background:#fff}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid #b8bfcc;border-radius:8px;background:#fff;flex:none}
textarea{resize:vertical}
.topbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;background:#141826;color:#fff}
.topbar .brand{font-weight:800;letter-spacing:.04em}
.topbar .ver{font-size:11px;opacity:.7;margin-left:4px}
.topbar .pname{flex:1 1 200px;min-width:0}
.topbar .pname input{background:#232838;border-color:#3a4157;color:#fff}
.topbar .actions{display:flex;flex-wrap:wrap;gap:6px}
.topbar button,.topbar .btn{background:#232838;border-color:#3a4157;color:#fff;font-size:13px;min-height:34px}
.ai-status{background:#fff7dc;border-bottom:1px solid #f0dc9a;color:#4a3b00;font-size:13px;padding:6px 16px}
.toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);max-width:min(92vw,560px);background:#141826;color:#fff;border-radius:10px;padding:10px 16px;opacity:0;pointer-events:none;transition:.25s;z-index:100;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast[data-kind=error]{background:var(--ng)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 12px 0;background:#e6e8ee;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs [role=tab]{flex:none;border-radius:8px 8px 0 0;border-bottom:none;background:#f3f4f7;font-size:14px}
.tabs [role=tab][aria-selected=true]{background:var(--card);font-weight:800;border-color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
main{padding:16px;max-width:1500px;margin:0 auto;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.card h2{font-size:18px;margin:0 0 8px}.card h3{font-size:16px;margin:12px 0 6px}.card h4{font-size:13px;margin:10px 0 2px;color:var(--muted)}
.sec-title{font-size:17px;margin:20px 0 8px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-2 .card{margin-bottom:0}
.span-all{grid-column:1/-1}
.plan-layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.plan-layout .card{margin-bottom:0}
.design{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:16px;align-items:start}
.design .card{margin-bottom:0}
.field{margin:10px 0;display:grid;gap:4px}
.field>label{font-weight:700;font-size:14px}
.field.st-unconfirmed{border-left:4px solid #e1b100;padding-left:8px}
.field.st-missing{border-left:4px solid var(--ng);padding-left:8px}
.field.st-confirmed{border-left:4px solid var(--ok);padding-left:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.row>select{width:auto}
.row>input[type=text],.row>input[type=number],.row>input[type=date]{flex:1 1 140px;width:auto}
.row.tiny button{min-height:30px;padding:3px 9px;font-size:13px}
.muted{color:var(--muted)}.small{font-size:13px}
.hint{font-size:12px;border-radius:4px;padding:1px 6px}
.lv-missing,.lv-block{color:var(--ng)}.lv-unconfirmed,.lv-claim,.lv-token,.lv-placeholder,.lv-unverified,.lv-review,.lv-unapproved{color:var(--warn)}
.badge{display:inline-block;font-size:12px;line-height:1.5;font-weight:700;border-radius:999px;padding:1px 8px;background:#e8ebf2;color:#2a3040;margin:1px 2px 1px 0}
.badge.ok{background:#dff1ea;color:var(--ok)}
.badge.soft{background:#f1f2f5;color:var(--muted);font-weight:500}
.badge.lv-missing,.badge.lv-block{background:#fbe3df;color:var(--ng)}
.badge.lv-unconfirmed,.badge.lv-claim,.badge.lv-token,.badge.lv-placeholder,.badge.lv-unverified,.badge.lv-review,.badge.lv-unapproved{background:#fff1cc;color:var(--warn)}
.ok{color:var(--ok)}.ng{color:var(--ng)}.warn{color:var(--warn)}
ul.plain{list-style:none;padding:0;margin:4px 0}
.tokens{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.token{display:grid;grid-template-columns:auto 1fr;gap:4px 6px;align-items:center}
.token label{grid-column:1/-1;font-weight:700;font-size:13px}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.mode{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;background:#fff}
.mode.on{border-color:var(--pri);background:#eef1ff;font-weight:700}
.mode-body{margin-top:8px}
label.inline{display:flex;gap:6px;align-items:flex-start;font-size:14px;margin:4px 0}
label.inline input{margin-top:5px;flex:none}
ol.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fafbfc}
.plan-item.sel{border-color:var(--pri);background:#eef1ff}
.plan-item .pick{display:grid;gap:2px;text-align:left;width:100%;border:none;background:transparent;padding:2px 0;justify-content:start}
.plan-item .role{font-size:12px;color:var(--muted);font-weight:400}
.plan-item .tags{margin:4px 0}
fieldset.refs{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 10px}
ul.issues{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px;font-size:13px}
.alert{background:#fbe3df;border:1px solid #f0b8ae;color:#5e140c;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.alert ul{margin:4px 0;padding-left:18px}
.okbox{background:#dff1ea;border:1px solid #a9d8c6;color:#0f4b3c;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.frame-wrap{--scale:1;width:calc(var(--fw) * var(--scale));height:calc(var(--fh) * var(--scale));overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
.frame-wrap iframe{width:var(--fw);height:var(--fh);border:0;transform:scale(var(--scale));transform-origin:0 0;display:block;background:#fff}
.cta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cta-card.active{border-color:var(--pri);box-shadow:0 0 0 2px #c9d1ff}
.table-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f3f4f7;white-space:nowrap}
.fiction-banner{position:sticky;top:0;z-index:5;background:#5e140c;color:#fff;font-weight:700;padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:14px}
.verdicts{padding-left:18px;font-size:14px}
.v-not-evaluable strong{color:var(--warn)}.v-difference-observed strong{color:var(--ok)}
.hyp .prio{font-size:12px;border-radius:999px;padding:1px 8px;color:#fff;background:#6b7280;vertical-align:2px}
.prio.p-高{background:var(--ng)}.prio.p-中{background:#b26a00}
.hyp ul{margin:2px 0;padding-left:18px;font-size:14px}
details summary{cursor:pointer;font-size:14px;margin:6px 0}
#gen-prompt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.rep-errors,.rep-rejected{color:var(--ng)}.rep-warnings{color:var(--warn)}.rep-added{color:var(--ok)}
@media (max-width:1100px){.plan-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.plan-layout>.card:last-child{grid-column:1/-1}.design{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.grid-2,.plan-layout{grid-template-columns:minmax(0,1fr)}main{padding:10px}.card{padding:12px}.topbar{padding:8px 10px}.topbar .actions{width:100%}.topbar button,.topbar .btn{flex:1 1 auto;padding:4px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">LP Studio <span class="ver">schema v1</span></div>
  <label class="pname"><span class="sr">プロジェクト名</span><input id="project-name" type="text" maxlength="120"></label>
  <div class="actions" role="toolbar" aria-label="プロジェクト操作">
    <button id="btn-undo" type="button" title="元に戻す (Ctrl+Z)">↶ 戻す</button>
    <button id="btn-redo" type="button" title="やり直す (Ctrl+Shift+Z)">↷ やり直す</button>
    <button id="btn-save" type="button">JSON保存</button>
    <label class="btn" for="file-load" tabindex="0" id="btn-load">JSON読込</label>
    <input id="file-load" type="file" accept=".json,application/json" class="sr">
    <button id="btn-seed" type="button">架空seed</button>
    <button id="btn-new" type="button">新規</button>
  </div>
</header>
<div id="ai-status" class="ai-status" role="note"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<nav class="tabs" role="tablist" aria-label="工程">
  <button role="tab" id="tab-brief" aria-controls="panel" data-tab="brief">1 ブリーフ</button>
  <button role="tab" id="tab-plan" aria-controls="panel" data-tab="plan">2 構成・WF</button>
  <button role="tab" id="tab-design" aria-controls="panel" data-tab="design">3 デザイン PC/SP</button>
  <button role="tab" id="tab-cta" aria-controls="panel" data-tab="cta">4 CTA比較</button>
  <button role="tab" id="tab-export" aria-controls="panel" data-tab="export">5 根拠・検証・Export</button>
  <button role="tab" id="tab-lpo" aria-controls="panel" data-tab="lpo">6 LPO</button>
  <button role="tab" id="tab-gen" aria-controls="panel" data-tab="gen">7 生成（Claude Code）</button>
</nav>
<main id="panel" role="tabpanel" tabindex="-1"></main>

// 参考: startdash.potex.jp/intro_ut の観察済みの流れ（依頼文の記述に基づく。元の文言は持ち込まない）
// FV → 任意のコンセプト動画 → 共感 → リフレーム/比較 → 解決策の起源/差別化 → ステップ → 提供範囲
// → 再コミット → 根拠 → 価格の理由 → 適合条件 → 未来のクロージング → フッター

const BRIEF_KEYS = [
  'product', 'audience', 'problem', 'promise', 'offer', 'price', 'ctaLabel', 'ctaUrl', 'tone', 'operator',
];

const BRIEF_LABELS = {
  product: '商材',
  audience: '対象者',
  problem: '課題',
  promise: '約束する価値',
  offer: 'オファー（条件）',
  price: '価格',
  ctaLabel: 'CTA文言',
  ctaUrl: 'CTAリンク先',
  tone: 'トーン',
  operator: '運営者表記',
};

const SECTION_CATALOG = {
  fv: {
    label: 'FV（ファーストビュー）',
    role: '誰の・どんな状態を・どう変えるかを3秒で伝え、最初のCTAを置く',
    rationale: '参考構成の起点。FV直下で離脱するかが全体の分母を決める',
    required: true,
    needs: ['audience', 'promise', 'ctaLabel', 'ctaUrl'],
    claimProne: true,
  },
  concept_video: {
    label: 'コンセプト動画（任意）',
    role: '世界観を短時間で伝える。素材がある場合だけ置く',
    rationale: '参考構成ではFV直後に任意で置かれている。素材が無いなら置かない',
    required: false,
    needs: [],
    claimProne: false,
  },
  empathy: {
    label: '共感',
    role: '対象者の現状の痛みを本人の言葉で言語化する',
    rationale: '「自分のことだ」と思わせる段。課題の解像度が低いと以降が他人事になる',
    required: true,
    needs: ['audience', 'problem'],
    claimProne: false,
  },
  reframe: {
    label: 'リフレーム / 比較',
    role: 'うまくいかない理由を捉え直し、従来の方法と比較する',
    rationale: '共感の直後に「原因の置き場所」を変えると、解決策を聞く理由が生まれる',
    required: true,
    needs: ['problem'],
    claimProne: true,
  },
  origin: {
    label: '解決策の起源 / 差別化',
    role: 'なぜこの解決策が生まれたか、何が違うかを示す',
    rationale: 'リフレームで生まれた問いに、この商材ならではの答えを出す段',
    required: true,
    needs: ['product', 'promise'],
    claimProne: true,
  },
  steps: {
    label: 'ステップ',
    role: '申込後に何が起きるかを手順で見せ、不安を減らす',
    rationale: '行動のハードルを下げる。参考構成でも提供範囲の前に置かれる',
    required: true,
    needs: ['product'],
    claimProne: false,
  },
  scope: {
    label: '提供範囲',
    role: '含むもの / 含まないものを明示する',
    rationale: '期待値を揃え、誤認を防ぐ（有利誤認の予防にもなる）',
    required: true,
    needs: ['product', 'offer'],
    claimProne: true,
  },
  recommit: {
    label: '再コミット（中間CTA）',
    role: 'ここまでの要点を一文で束ね、もう一度行動を促す',
    rationale: '長いLPの中間で決めた人を取りこぼさない',
    required: false,
    needs: ['promise', 'ctaLabel'],
    claimProne: true,
  },
  proof: {
    label: '根拠',
    role: '検証済みの事実・出典だけで主張を支える',
    rationale: '参考の品質目標（実績カード/図解）。ただし検証済みevidenceのみ公開する',
    required: true,
    needs: [],
    needsEvidence: true,
    claimProne: true,
  },
  price_reason: {
    label: '価格 / 条件の理由',
    role: '価格やオファー条件がなぜその設定なのかを説明する',
    rationale: '価格への疑問を先回りして解く。比較価格は根拠が無ければ出さない',
    required: false,
    needs: ['offer', 'price'],
    claimProne: true,
  },
  fit: {
    label: '適合条件',
    role: '向いている人 / 向いていない人を明示する',
    rationale: '合わない人を先に外すことで、申込後のミスマッチと不信を減らす',
    required: true,
    needs: ['audience'],
    claimProne: true,
  },
  closing: {
    label: '未来のクロージング',
    role: '行動した後の状態を描き、最後のCTAを置く',
    rationale: '参考構成の終盤。約束する価値と同じ言葉で閉じる',
    required: true,
    needs: ['promise', 'ctaLabel', 'ctaUrl'],
    claimProne: true,
  },
  footer: {
    label: 'フッター',
    role: '運営者表記・注記',
    rationale: '運営者表記が確定していないページは公開しない',
    required: true,
    needs: ['operator'],
    claimProne: false,
  },
};

const SECTION_TYPES = Object.keys(SECTION_CATALOG);
const DEFAULT_ORDER = SECTION_TYPES.filter((t) => t !== 'concept_video');
const SECTION_FIELDS = ['heading', 'lead', 'body', 'items', 'itemsAlt', 'note'];

/**
 * セクション計画: 各セクションの役割・根拠・不足情報を返す。
 */
function planSections(project) {
  const brief = project.brief || {};
  const evidence = project.evidence || [];
  const verified = evidence.filter((e) => e.status === 'verified');
  return (project.sections || []).map((s, index) => {
    const meta = SECTION_CATALOG[s.type];
    const missing = [];
    for (const key of meta.needs) {
      const f = brief[key];
      if (!f || f.status === 'missing' || !String(f.value || '').trim()) {
        missing.push({ key, label: BRIEF_LABELS[key], level: 'missing' });
      } else if (f.status !== 'confirmed') {
        missing.push({ key, label: BRIEF_LABELS[key], level: 'unconfirmed' });
      }
    }
    if (meta.needsEvidence && verified.length === 0) {
      missing.push({ key: 'evidence', label: '検証済みの根拠', level: 'missing' });
    }
    if (s.type === 'concept_video' && !s.fields?.body) {
      missing.push({ key: 'video', label: '動画素材（未設定なら外す）', level: 'missing' });
    }
    return {
      index,
      id: s.id,
      type: s.type,
      label: meta.label,
      role: meta.role,
      rationale: meta.rationale,
      required: meta.required,
      approved: !!s.approved,
      needsReview: !!s.needsReview,
      origin: s.origin,
      missing,
    };
  });
}

return { planSections, BRIEF_KEYS, BRIEF_LABELS, SECTION_CATALOG, SECTION_TYPES, DEFAULT_ORDER, SECTION_FIELDS };
})();

__mods.schema = (() => {
// project JSON の schema / version / validation / migration。
// 方針: 既知のキーだけを新しいオブジェクトへコピーする（未知キーは警告して削除）。
// HTML は文字列として保持するだけで、描画時に必ず escape する。HTML import は存在しない。

const { SECTION_TYPES, BRIEF_KEYS } = __mods.sections;
const { safeUrl, safeColor, stripControl } = __mods.util;
const SCHEMA_VERSION = 1;
const MAX_JSON_BYTES = 2 * 1024 * 1024;
const DANGEROUS_KEYS = new Set(['__proto__', 'constructor', 'prototype']);

const BRIEF_STATUS = ['confirmed', 'unconfirmed', 'missing'];
const CATEGORIES = ['general', 'education', 'health', 'beauty', 'finance', 'employment'];
const EVIDENCE_STATUS = ['verified', 'unverified'];
const SOURCE_TYPES = ['document', 'url', 'internal-data', 'customer-consent', 'policy', 'other'];
const PROVENANCE = ['human', 'template', 'claude-code', 'seed'];
const ORIGINS = ['template', 'claude-code', 'manual'];
const CTA_TIMINGS = ['spec', 'always', 'after-half'];
const FONTS = ['sans', 'serif', 'rounded'];

const str = (max, extra = {}) => ({ t: 'string', max, ...extra });
const briefField = { t: 'object', fields: { value: str(600), status: { t: 'string', enum: BRIEF_STATUS } }, required: ['value', 'status'] };

const variantSpec = {
  t: 'object',
  fields: {
    id: str(40, { pattern: /^[A-Za-z0-9_-]{1,40}$/ }),
    name: str(80),
    expectedShare: { t: 'number', min: 0, max: 1 },
    unit: { t: 'string', enum: ['users', 'sessions', 'pageviews'] },
    conversionDefinition: str(200),
    measurement: str(200),
    visitors: { t: 'number', min: 0, int: true, nullable: true },
    ctaClicks: { t: 'number', min: 0, int: true, nullable: true },
    conversions: { t: 'number', min: 0, int: true, nullable: true },
  },
  required: ['id', 'name', 'unit', 'conversionDefinition', 'measurement', 'visitors', 'conversions'],
};

const experimentSpec = {
  t: 'object',
  fields: {
    id: str(40, { pattern: /^[A-Za-z0-9_-]{1,40}$/ }),
    name: str(120),
    page: str(120),
    timezone: str(64, { pattern: /^[A-Za-z_]+(\/[A-Za-z0-9_+-]+)*$/ }),
    start: str(10, { pattern: /^\d{4}-\d{2}-\d{2}$/ }),
    end: str(10, { pattern: /^\d{4}-\d{2}-\d{2}$/ }),
    plannedEnd: str(10, { pattern: /^\d{4}-\d{2}-\d{2}$/ }),
    missingDays: { t: 'number', min: 0, int: true },
    variants: { t: 'array', of: variantSpec, max: 8, min: 1 },
    notes: str(400),
  },
  required: ['id', 'name', 'timezone', 'start', 'end', 'plannedEnd', 'variants'],
};

const DATASET_SPEC = {
  t: 'object',
  fields: {
    fictional: { t: 'bool' },
    name: str(120),
    experiments: { t: 'array', of: experimentSpec, max: 20 },
  },
  required: ['fictional', 'name', 'experiments'],
};

const PROJECT_SPEC = {
  t: 'object',
  fields: {
    schemaVersion: { t: 'number', int: true },
    id: str(40, { pattern: /^[A-Za-z0-9_-]{1,40}$/ }),
    name: str(120),
    updatedAt: str(40),
    brief: {
      t: 'object',
      fields: {
        ...Object.fromEntries(BRIEF_KEYS.map((k) => [k, briefField])),
        category: { t: 'string', enum: CATEGORIES },
      },
      required: [...BRIEF_KEYS, 'category'],
    },
    brand: {
      t: 'object',
      fields: {
        primary: str(7), accent: str(7), ink: str(7), paper: str(7),
        font: { t: 'string', enum: FONTS },
      },
      required: ['primary', 'accent', 'ink', 'paper', 'font'],
    },
    evidence: {
      t: 'array', max: 100,
      of: {
        t: 'object',
        fields: {
          id: str(40, { pattern: /^[A-Za-z0-9_-]{1,40}$/ }),
          claim: str(300),
          sourceType: { t: 'string', enum: SOURCE_TYPES },
          source: str(300),
          status: { t: 'string', enum: EVIDENCE_STATUS },
          verifiedBy: str(80),
          verifiedAt: str(10),
          provenance: { t: 'string', enum: PROVENANCE },
          metricValue: { t: 'number', nullable: true },
          metricUnit: str(12),
          note: str(300),
        },
        required: ['id', 'claim', 'sourceType', 'source', 'status', 'provenance'],
      },
    },
    sections: {
      t: 'array', max: 40,
      of: {
        t: 'object',
        fields: {
          id: str(40, { pattern: /^[A-Za-z0-9_-]{1,40}$/ }),
          type: { t: 'string', enum: SECTION_TYPES },
          approved: { t: 'bool' },
          needsReview: { t: 'bool' },
          origin: { t: 'string', enum: ORIGINS },
          fields: {
            t: 'object',
            fields: {
              heading: str(200), lead: str(400), body: str(2000), note: str(400),
              items: { t: 'array', of: str(300), max: 12 },
              itemsAlt: { t: 'array', of: str(300), max: 12 },
            },
            required: [],
          },
          claimRefs: { t: 'array', of: str(40), max: 20 },
        },
        required: ['id', 'type', 'fields'],
      },
    },
    cta: {
      t: 'object',
      fields: {
        activeVariant: str(40),
        variants: {
          t: 'array', max: 4, min: 1,
          of: {
            t: 'object',
            fields: {
              id: str(40, { pattern: /^[A-Za-z0-9_-]{1,40}$/ }),
              label: str(40),
              color: str(7),
              timing: { t: 'string', enum: CTA_TIMINGS },
            },
            required: ['id', 'label', 'color', 'timing'],
          },
        },
      },
      required: ['activeVariant', 'variants'],
    },
    lpo: { t: 'object', fields: { dataset: { ...DATASET_SPEC, nullable: true } }, required: [] },
  },
  required: ['schemaVersion', 'id', 'name', 'brief', 'brand', 'evidence', 'sections', 'cta'],
};

function walk(spec, value, path, ctx) {
  if (value === null && spec.nullable) return null;
  switch (spec.t) {
    case 'string': {
      if (typeof value !== 'string') { ctx.errors.push(`${path}: 文字列ではありません`); return undefined; }
      let v = stripControl(value);
      if (v.length > spec.max) { ctx.errors.push(`${path}: ${spec.max}文字を超えています`); return undefined; }
      if (spec.enum && !spec.enum.includes(v)) { ctx.errors.push(`${path}: 許可されない値 "${v.slice(0, 40)}"`); return undefined; }
      if (spec.pattern && !spec.pattern.test(v)) { ctx.errors.push(`${path}: 形式が不正です`); return undefined; }
      if (/<\s*\/?\s*[a-z!]|javascript:/i.test(v)) ctx.warnings.push(`${path}: HTML/スクリプトらしき文字列があります（テキストとして扱い、実行しません）`);
      return v;
    }
    case 'number': {
      if (typeof value !== 'number' || !Number.isFinite(value)) { ctx.errors.push(`${path}: 数値ではありません`); return undefined; }
      if (spec.int && !Number.isInteger(value)) { ctx.errors.push(`${path}: 整数ではありません`); return undefined; }
      if (spec.min != null && value < spec.min) { ctx.errors.push(`${path}: ${spec.min}未満です`); return undefined; }
      if (spec.max != null && value > spec.max) { ctx.errors.push(`${path}: ${spec.max}を超えています`); return undefined; }
      return value;
    }
    case 'bool':
      if (typeof value !== 'boolean') { ctx.errors.push(`${path}: true/false ではありません`); return undefined; }
      return value;
    case 'array': {
      if (!Array.isArray(value)) { ctx.errors.push(`${path}: 配列ではありません`); return undefined; }
      if (spec.max != null && value.length > spec.max) { ctx.errors.push(`${path}: 要素が${spec.max}件を超えています`); return undefined; }
      if (spec.min != null && value.length < spec.min) { ctx.errors.push(`${path}: 要素が${spec.min}件未満です`); return undefined; }
      const out = [];
      value.forEach((item, i) => {
        const v = walk(spec.of, item, `${path}[${i}]`, ctx);
        if (v !== undefined) out.push(v);
      });
      return out;
    }
    case 'object': {
      if (typeof value !== 'object' || value === null || Array.isArray(value)) { ctx.errors.push(`${path}: オブジェクトではありません`); return undefined; }
      const out = {};
      for (const key of Object.keys(value)) {
        if (DANGEROUS_KEYS.has(key)) { ctx.errors.push(`${path}.${key}: 禁止キーです`); continue; }
        if (!Object.prototype.hasOwnProperty.call(spec.fields, key)) { ctx.warnings.push(`${path}.${key}: 未知のキーを削除しました`); continue; }
        const v = walk(spec.fields[key], value[key], `${path}.${key}`, ctx);
        if (v !== undefined) out[key] = v;
      }
      for (const key of spec.required || []) {
        if (!(key in value)) ctx.errors.push(`${path}.${key}: 必須項目がありません`);
      }
      return out;
    }
    default:
      ctx.errors.push(`${path}: schema 定義エラー`);
      return undefined;
  }
}

function validateShape(spec, value, path = '$') {
  const ctx = { errors: [], warnings: [] };
  const out = walk(spec, value, path, ctx);
  return { value: out, errors: ctx.errors, warnings: ctx.warnings };
}

/** schemaVersion 欠落（v0: brief の値が素の文字列）→ v1 */
function migrate(input) {
  if (typeof input !== 'object' || input === null || Array.isArray(input)) {
    return { value: input, notes: [] };
  }
  const notes = [];
  let p = input;
  if (p.schemaVersion === undefined) {
    p = { ...p, schemaVersion: 1 };
    if (p.brief && typeof p.brief === 'object') {
      const brief = {};
      for (const [k, v] of Object.entries(p.brief)) {
        if (DANGEROUS_KEYS.has(k)) continue;
        brief[k] = typeof v === 'string' && k !== 'category' ? { value: v, status: v.trim() ? 'unconfirmed' : 'missing' } : v;
      }
      p.brief = brief;
    }
    notes.push('v0 → v1 に移行しました（ブリーフ値はすべて「未確認」扱い）');
  }
  return { value: p, notes };
}

/**
 * 形の検証に加えて意味の検証（ID一意・参照・URL・色・verified の要件）。
 * 返り値の project は安全に使える正規化済みのコピー。
 */
function validateProject(input) {
  const migrated = migrate(input);
  const warnings = [...migrated.notes];
  const raw = migrated.value;
  if (typeof raw !== 'object' || raw === null || Array.isArray(raw)) {
    return { ok: false, errors: ['$: project はオブジェクトである必要があります'], warnings, project: null };
  }
  if (raw.schemaVersion !== SCHEMA_VERSION) {
    return { ok: false, errors: [`$.schemaVersion: 未対応の版です（${String(raw.schemaVersion).slice(0, 10)}）。対応: ${SCHEMA_VERSION}`], warnings, project: null };
  }
  const shape = validateShape(PROJECT_SPEC, raw);
  const errors = [...shape.errors];
  warnings.push(...shape.warnings);
  const p = shape.value;
  if (errors.length || !p) return { ok: false, errors, warnings, project: null };

  // CTA URL
  if (p.brief.ctaUrl.value && !safeUrl(p.brief.ctaUrl.value)) {
    warnings.push('$.brief.ctaUrl: 許可されないURLのため除去しました（https / mailto / tel / #id のみ）');
    p.brief.ctaUrl = { value: '', status: 'missing' };
  }
  // 色
  for (const k of ['primary', 'accent', 'ink', 'paper']) {
    if (!safeColor(p.brand[k])) errors.push(`$.brand.${k}: 色は #RRGGBB 形式のみ`);
    else p.brand[k] = safeColor(p.brand[k]);
  }
  for (const [i, v] of p.cta.variants.entries()) {
    if (!safeColor(v.color)) errors.push(`$.cta.variants[${i}].color: 色は #RRGGBB 形式のみ`);
    else v.color = safeColor(v.color);
  }
  if (!p.cta.variants.some((v) => v.id === p.cta.activeVariant)) {
    warnings.push('$.cta.activeVariant: 存在しないため先頭に戻しました');
    p.cta.activeVariant = p.cta.variants[0].id;
  }
  // ID一意
  const uniq = (list, label) => {
    const seen = new Set();
    for (const item of list) {
      if (seen.has(item.id)) errors.push(`${label}: ID "${item.id}" が重複しています`);
      seen.add(item.id);
    }
    return seen;
  };
  const evIds = uniq(p.evidence, '$.evidence');
  uniq(p.sections, '$.sections');
  uniq(p.cta.variants, '$.cta.variants');
  // verified の要件（確認者・確認日が無ければ降格）
  for (const e of p.evidence) {
    if (e.status === 'verified' && (!e.verifiedBy?.trim() || !/^\d{4}-\d{2}-\d{2}$/.test(e.verifiedAt || ''))) {
      e.status = 'unverified';
      warnings.push(`$.evidence.${e.id}: 確認者・確認日が無いため unverified に降格しました`);
    }
  }
  for (const s of p.sections) {
    s.approved = !!s.approved;
    s.needsReview = !!s.needsReview;
    s.origin = s.origin || 'manual';
    s.fields = { heading: '', lead: '', body: '', note: '', items: [], itemsAlt: [], ...s.fields };
    s.claimRefs = (s.claimRefs || []).filter((r) => {
      if (!evIds.has(r)) { warnings.push(`$.sections.${s.id}.claimRefs: 存在しない根拠 "${r}" を外しました`); return false; }
      return true;
    });
  }
  if (!p.lpo) p.lpo = { dataset: null };
  if (p.lpo.dataset === undefined) p.lpo.dataset = null;
  if (p.lpo.dataset && p.lpo.dataset.fictional !== true) {
    errors.push('$.lpo.dataset.fictional: このツールは架空データのみ扱います（fictional: true が必要）');
  }
  return { ok: errors.length === 0, errors, warnings, project: errors.length ? null : p };
}

/** 文字列 → project。HTML は受け付けない。 */
function parseProjectJson(text) {
  if (typeof text !== 'string') return { ok: false, errors: ['入力が文字列ではありません'], warnings: [], project: null };
  const bytes = new TextEncoder().encode(text).length;
  if (bytes > MAX_JSON_BYTES) return { ok: false, errors: [`JSONが大きすぎます（${bytes} bytes > ${MAX_JSON_BYTES}）`], warnings: [], project: null };
  const trimmed = text.trim();
  if (/^</.test(trimmed)) return { ok: false, errors: ['HTMLは読み込めません。project JSON だけを受け付けます'], warnings: [], project: null };
  let data;
  try {
    data = JSON.parse(trimmed, (key, value) => {
      if (DANGEROUS_KEYS.has(key)) throw new Error(`禁止キー "${key}" を含んでいます`);
      return value;
    });
  } catch (e) {
    return { ok: false, errors: [`JSONとして読めません: ${String(e.message).slice(0, 120)}`], warnings: [], project: null };
  }
  return validateProject(data);
}

function serializeProject(project) {
  return JSON.stringify(project, null, 2);
}

return { validateShape, migrate, validateProject, parseProjectJson, serializeProject, SCHEMA_VERSION, MAX_JSON_BYTES, BRIEF_STATUS, CATEGORIES, EVIDENCE_STATUS, SOURCE_TYPES, PROVENANCE, ORIGINS, CTA_TIMINGS, FONTS, DATASET_SPEC, PROJECT_SPEC };
})();

__mods.claims = (() => {
// エビデンス / claim validation。
// fail-closed の補助: 検出された主張は、そのセクションが claimRefs で指す verified evidence に
// 同じ数値・語が含まれていなければ「未解決」。safe export は未解決フィールドを出さない。

const { BRIEF_KEYS, BRIEF_LABELS, SECTION_CATALOG } = __mods.sections;
// 参考LP固有のオファー・実績値。別ブランドへの転用を止める。
const REFERENCE_DENYLIST = [
  '3日間', '三日間', '月100人', '100人限定', '先着100', '受講生1140', '1140人', '1,140人', '1140名', '1,140名',
];

const PATTERNS = [
  { category: 'number', label: '数値の主張', re: /[0-9０-９][0-9０-９,，.．]*\s*(?:万|億)?\s*(?:人|名|社|件|%|％|倍|円|年|ヶ月|か月|カ月|日間|日|時間|分|位|回|点|校|店舗|都道府県)/g },
  { category: 'superlative', label: '最上級・比較', re: /(No\.?\s?1|ナンバーワン|日本一|業界初|業界最|世界初|最高|最強|最安|唯一|圧倒的|他社より|どこよりも)/gi },
  { category: 'guarantee', label: '保証・断定', re: /(保証|絶対|必ず|確実に|100%|１００％|誰でも|リスクなし|ノーリスク|失敗しない|返金)/g },
  { category: 'urgency', label: '煽り・限定', re: /(今だけ|残りわずか|期間限定|限定|先着|締切間近|急いで|最後のチャンス|今すぐ)/g },
  { category: 'authority', label: '権威', re: /(医師|専門家|教授|監修|推奨|認定|受賞|公式|メディア掲載|特許)/g },
  { category: 'testimonial', label: '推薦・お客様の声', re: /(お客様の声|受講生の声|体験談|口コミ|満足度|推薦|喜びの声)/g },
  { category: 'offer', label: 'オファー・価格', re: /(無料|0円|０円|割引|半額|特典|通常価格|定価|キャンペーン|オフ\b|OFF)/gi },
];

const PHARMA = { category: 'pharma', label: '薬機法（効能効果）', re: /(治る|治す|治療|改善する|痩せる|やせる|効く|効果がある|若返|シミが消え|アンチエイジング|デトックス|免疫)/g };

function normalize(text) {
  return String(text ?? '').normalize('NFKC').replace(/[\s,，]/g, '');
}

function detectClaims(text, category = 'general') {
  const s = String(text ?? '');
  const found = [];
  const pats = ['health', 'beauty'].includes(category) ? [...PATTERNS, PHARMA] : PATTERNS;
  for (const p of pats) {
    for (const m of s.matchAll(p.re)) {
      found.push({ category: p.category, label: p.label, match: m[0], severity: p.category === 'pharma' ? 'block' : 'needs-evidence' });
    }
  }
  const norm = normalize(s);
  for (const d of REFERENCE_DENYLIST) {
    if (norm.includes(normalize(d))) {
      found.push({ category: 'reference', label: '参考LP固有の値', match: d, severity: 'block' });
    }
  }
  return found;
}

const PLACEHOLDER_RE = /【(?:要記入|未入力|不明な差込)[^】]*】/;

const TOKEN_RE = /\{\{\s*([a-zA-Z]+)\s*\}\}/g;

/**
 * {{key}} をブリーフ値に置換。confirmed 以外は未解決として返す。
 * mode: 'draft' は値を入れて未確認を記録 / 'wf' はプレースホルダ表示 / 'safe' は未確認を記録（呼び出し側で除外）
 */
function resolveTokens(text, brief) {
  const unresolved = [];
  const out = String(text ?? '').replace(TOKEN_RE, (all, key) => {
    if (!BRIEF_KEYS.includes(key)) { unresolved.push({ key, reason: 'unknown' }); return `【不明な差込: ${key}】`; }
    const f = brief[key];
    if (!f || f.status === 'missing' || !String(f.value).trim()) {
      unresolved.push({ key, reason: 'missing' });
      return `【未入力: ${BRIEF_LABELS[key]}】`;
    }
    if (f.status !== 'confirmed') unresolved.push({ key, reason: 'unconfirmed' });
    return f.value;
  });
  return { text: out, unresolved };
}

function evidenceCovers(ev, claim) {
  const evNorm = normalize(ev.claim);
  return evNorm.includes(normalize(claim.match));
}

/**
 * 1フィールドを評価する。
 * 返り値: { text, claims:[{..., resolved, evidenceId}], unresolvedTokens, publishable }
 */
function assessText(project, section, rawText) {
  const { text, unresolved } = resolveTokens(rawText, project.brief);
  const refs = new Set(section.claimRefs || []);
  const verifiedRefs = (project.evidence || []).filter((e) => refs.has(e.id) && e.status === 'verified');
  const claims = detectClaims(text, project.brief.category).map((c) => {
    if (c.severity === 'block') return { ...c, resolved: false, evidenceId: null };
    const ev = verifiedRefs.find((e) => evidenceCovers(e, c));
    return { ...c, resolved: !!ev, evidenceId: ev ? ev.id : null };
  });
  const placeholder = PLACEHOLDER_RE.test(text);
  const publishable = !placeholder && unresolved.length === 0 && claims.every((c) => c.resolved);
  return { text, claims, unresolvedTokens: unresolved, placeholder, publishable };
}

/** プロジェクト全体の監査。UI の警告一覧と export レポートの元。 */
function auditProject(project) {
  const issues = [];
  const brief = project.brief;
  const category = brief.category;
  // ブリーフ
  for (const key of BRIEF_KEYS) {
    const f = brief[key];
    if (f.status === 'missing' || !f.value.trim()) issues.push({ scope: 'brief', key, level: 'missing', message: `${BRIEF_LABELS[key]} が未入力` });
    else if (f.status === 'unconfirmed') issues.push({ scope: 'brief', key, level: 'unconfirmed', message: `${BRIEF_LABELS[key]} が未確定（公開HTMLには出しません）` });
    for (const c of detectClaims(f.value, category)) {
      if (c.category === 'reference') issues.push({ scope: 'brief', key, level: 'block', message: `${BRIEF_LABELS[key]}: 参考LP固有の値「${c.match}」。この事業で実際に決まった条件か確認してください` });
    }
  }
  // 根拠
  for (const e of project.evidence) {
    if (e.status !== 'verified') issues.push({ scope: 'evidence', key: e.id, level: 'unverified', message: `根拠「${e.claim.slice(0, 40)}」は未検証（公開HTMLには出しません）` });
  }
  // セクション
  for (const s of project.sections) {
    const meta = SECTION_CATALOG[s.type];
    if (!s.approved) issues.push({ scope: 'section', key: s.id, level: 'unapproved', message: `${meta.label}: 未承認（safe export に出ません）` });
    if (s.needsReview) issues.push({ scope: 'section', key: s.id, level: 'review', message: `${meta.label}: 訴求変更後の整合を要確認` });
    for (const [field, value] of fieldEntries(s)) {
      const a = assessText(project, s, value);
      for (const c of a.claims.filter((x) => !x.resolved)) {
        issues.push({ scope: 'section', key: s.id, field, level: c.severity === 'block' ? 'block' : 'claim', message: `${meta.label}/${field}: ${c.label}「${c.match}」に検証済みの根拠がありません` });
      }
      if (a.placeholder && !a.unresolvedTokens.length) issues.push({ scope: 'section', key: s.id, field, level: 'placeholder', message: `${meta.label}/${field}: 【要記入】が残っています` });
      for (const t of a.unresolvedTokens) {
        issues.push({ scope: 'section', key: s.id, field, level: 'token', message: `${meta.label}/${field}: ${BRIEF_LABELS[t.key] || t.key} が${t.reason === 'unconfirmed' ? '未確定' : '未入力'}` });
      }
    }
  }
  return issues;
}

function fieldEntries(section) {
  const f = section.fields || {};
  const out = [];
  for (const k of ['heading', 'lead', 'body', 'note']) if (f[k]) out.push([k, f[k]]);
  for (const k of ['items', 'itemsAlt']) (f[k] || []).forEach((v, i) => out.push([`${k}[${i}]`, v]));
  return out;
}

return { normalize, detectClaims, resolveTokens, assessText, auditProject, fieldEntries, REFERENCE_DENYLIST, PLACEHOLDER_RE };
})();

__mods.generate = (() => {

const { detectClaims, REFERENCE_DENYLIST, normalize } = __mods.claims;

const ADAPTERS = {

function templateSection(type, project) {
  return {
    id: makeId(type.replace('_', '')),
    type,
    approved: false,
    needsReview: false,
    origin: 'template',
    fields: TEMPLATES[type](),

  };
}

/** モード1: LP全体作成（template） */
function generateAllTemplate(project, { includeVideo = false } = {}) {
  const p = clone(project);
  const order = includeVideo ? ['fv', 'concept_video', ...DEFAULT_ORDER.slice(1)] : DEFAULT_ORDER;
  p.sections = order.map((t) => templateSection(t, p));
  return p;
}

/** モード2: 訴求変更。約束する価値を差し替え、訴求系だけ作り直し、残りに要確認を立てる */
function reangleTemplate(project, newPromise) {
  const p = clone(project);
  p.brief.promise = { value: String(newPromise).slice(0, 600), status: 'unconfirmed' };
  p.sections = p.sections.map((s) => {
    if (ANGLE_TYPES.includes(s.type)) {
      return { ...s, fields: TEMPLATES[s.type](), origin: 'template', approved: false, needsReview: false };
    }
    if (s.type === 'footer') return s;
    return { ...s, needsReview: true, approved: false };
  });
  return p;
}

/** モード3: セクション単体の再生成（template） */
function regenerateSectionTemplate(project, sectionId) {
  const p = clone(project);
  const i = p.sections.findIndex((s) => s.id === sectionId);
  if (i < 0) throw new Error('セクションが見つかりません');
  const s = p.sections[i];
  p.sections[i] = { ...s, fields: TEMPLATES[s.type](), origin: 'template', approved: false, needsReview: false,
    claimRefs: s.type === 'proof' ? p.evidence.map((e) => e.id) : s.claimRefs };
  return p;
}

const GENERATED_SECTION_SPEC = {
  t: 'object',
  fields: {
    type: { t: 'string', enum: SECTION_TYPES },
    fields: {
      t: 'object',
      fields: {
        heading: { t: 'string', max: 200 }, lead: { t: 'string', max: 400 }, body: { t: 'string', max: 2000 }, note: { t: 'string', max: 400 },
        items: { t: 'array', of: { t: 'string', max: 300 }, max: 12 },
        itemsAlt: { t: 'array', of: { t: 'string', max: 300 }, max: 12 },
      },
      required: [],
    },
    claimRefs: { t: 'array', of: { t: 'string', max: 40 }, max: 20 },
  },
  required: ['type', 'fields'],
};

const RESPONSE_SPEC = {
  t: 'object',
  fields: {
    generator: { t: 'string', enum: ['claude-code'] },
    mode: { t: 'string', enum: ['full', 'reangle', 'section'] },
    promise: { t: 'string', max: 600 },
    sections: { t: 'array', of: GENERATED_SECTION_SPEC, max: 20, min: 1 },
    evidenceCandidates: {
      t: 'array', max: 20,
      of: { t: 'object', fields: { claim: { t: 'string', max: 300 }, source: { t: 'string', max: 300 } }, required: ['claim', 'source'] },
    },
  },
  required: ['generator', 'mode', 'sections'],
};

/** Claude Code に渡す生成指示（Markdown）。JSON の契約と禁止事項を含む。 */
function buildPrompt(project, mode = 'full', target = {}) {
  const lines = [];
  lines.push('# LP Studio 生成指示（Claude Code 用）', '');
  lines.push('あなたは LP の構成・コピーの**下書き**を書く。出力は下記 JSON 契約に従う JSON のみ（```json フェンス可）。');
  lines.push('この出力はツール側で schema 検証され、すべて「未承認」「根拠未検証」として取り込まれる。人が確認するまで公開されない。', '');
  lines.push('## 禁止事項（違反したフィールドは取り込み時に拒否・除外される）');
  lines.push('- ブリーフや根拠に無い数値・実績・受講者数・満足度・ランキング・受賞・メディア掲載を書かない');
  lines.push('- 推薦文・お客様の声・専門家/医師の権威づけを創作しない');
  lines.push('- 保証・断定（必ず/絶対/誰でも）、煽り（今だけ/残りわずか/限定）を書かない');
  lines.push('- 効能効果（治る/痩せる/効く 等）を書かない');
  lines.push(`- 参考LP固有の値を使わない: ${REFERENCE_DENYLIST.join(' / ')}`);
  lines.push('- ブリーフ値は {{key}} 差込で参照する（例: {{offer}}）。値を書き写さない。使えるキー: ' + BRIEF_KEYS.join(', '));
  lines.push('- 分からないこと・ヒアリングが要ることは 【要記入: 何が必要か】 と書く。埋め合わせない');
  lines.push('- HTML タグ・スクリプト・URL を書かない（プレーンテキストのみ）', '');
  lines.push('## ブリーフ（status: confirmed=確定 / unconfirmed=未確定 / missing=未入力）');
  for (const k of BRIEF_KEYS) {
    const f = project.brief[k];
    lines.push(`- ${k}（${BRIEF_LABELS[k]}）[${f.status}]: ${f.value || '（なし）'}`);
  }
  lines.push(`- category: ${project.brief.category}`, '');
  lines.push('## 根拠（id / status / 内容）。claimRefs には verified のものだけを入れる');
  if (!project.evidence.length) lines.push('- （なし）');
  for (const e of project.evidence) lines.push(`- ${e.id} [${e.status}] ${e.claim}（出典: ${e.source}）`);
  lines.push('');
  lines.push('## セクションの役割（参考構成の流れ）');
  for (const t of SECTION_TYPES) {
    const m = SECTION_CATALOG[t];
    lines.push(`- ${t}: ${m.label} — ${m.role}${m.required ? '（必須）' : '（任意）'}`);
  }
  lines.push('');
  lines.push('## 依頼');
  if (mode === 'full') {
    lines.push('LP全体の sections を上の順で書く（concept_video は素材が無いので不要）。');
  } else if (mode === 'reangle') {
    lines.push(`訴求を「${String(target.promise || '').slice(0, 200)}」に変える。promise と、fv / recommit / closing の 3 セクションだけを書く。`);
  } else {
    const s = project.sections.find((x) => x.id === target.sectionId);
    lines.push(`セクション ${s ? s.type : '(未指定)'} を 1 つだけ書き直す。現在の内容: ${s ? JSON.stringify(s.fields) : '-'}`);
  }
  lines.push('');
  lines.push('## JSON 契約');
  lines.push('```json');
  lines.push(JSON.stringify({
    generator: 'claude-code',
    mode,
    ...(mode === 'reangle' ? { promise: '新しい約束（プレーンテキスト）' } : {}),
    sections: [{ type: 'fv', fields: { heading: '', lead: '', body: '', note: '', items: [], itemsAlt: [] }, claimRefs: [] }],
    evidenceCandidates: [{ claim: '確認が必要な事実の候補', source: 'どこで確認できるか' }],
  }, null, 2));
  lines.push('```');
  return lines.join('\n');
}

function extractJson(text) {
  const s = String(text ?? '').trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  return fence ? fence[1] : s;
}

/** brief に confirmed で入っていない denylist 値・HTML を含むフィールドを除外 */
function screenFields(fields, project, report, label) {
  const confirmedNorm = BRIEF_KEYS.filter((k) => project.brief[k].status === 'confirmed').map((k) => normalize(project.brief[k].value)).join('|');
  const bad = (v) => {
    if (/<\s*\/?\s*[a-z!]|javascript:|https?:\/\//i.test(v)) return 'HTML/URL を含む';
    const ref = detectClaims(v).find((c) => c.category === 'reference' && !confirmedNorm.includes(normalize(c.match)));
    return ref ? `参考LP固有の値「${ref.match}」` : null;
  };
  const out = { heading: '', lead: '', body: '', note: '', items: [], itemsAlt: [] };
  for (const k of ['heading', 'lead', 'body', 'note']) {
    const v = fields[k] || '';
    const why = v && bad(v);
    if (why) report.rejected.push(`${label}.${k}: ${why}のため拒否`);
    else out[k] = v;
  }
  for (const k of ['items', 'itemsAlt']) {
    for (const v of fields[k] || []) {
      const why = bad(v);
      if (why) report.rejected.push(`${label}.${k}: ${why}のため拒否`);
      else out[k].push(v);
    }
  }
  return out;
}

/**
 * Claude Code の出力（JSON 文字列）を検証して project に取り込む。
 * 返り値: { ok, project, report: { errors, warnings, rejected, added } }
 */
function ingestGenerated(project, responseText, { mode, sectionId } = {}) {
  const report = { errors: [], warnings: [], rejected: [], added: [] };
  let data;
  try {
    data = JSON.parse(extractJson(responseText), (k, v) => {
      if (k === '__proto__' || k === 'constructor' || k === 'prototype') throw new Error(`禁止キー "${k}"`);
      return v;
    });
  } catch (e) {
    report.errors.push(`JSONとして読めません: ${String(e.message).slice(0, 120)}`);
    return { ok: false, project, report };
  }
  const shape = validateShape(RESPONSE_SPEC, data, '$response');
  report.errors.push(...shape.errors);
  report.warnings.push(...shape.warnings);
  if (shape.errors.length) return { ok: false, project, report };
  const r = shape.value;
  if (mode && r.mode !== mode) {
    report.errors.push(`mode が一致しません（期待: ${mode} / 応答: ${r.mode}）`);
    return { ok: false, project, report };
  }
  const p = clone(project);
  const evIds = new Set(p.evidence.map((e) => e.id));
  const toSection = (g, keep) => {
    const refs = (g.claimRefs || []).filter((id) => {
      if (!evIds.has(id)) { report.warnings.push(`claimRefs "${id}" は存在しないため外しました`); return false; }
      return true;
    });
    return {
      id: keep?.id || makeId(g.type.replace('_', '')),
      type: g.type,
      approved: false, // 強制
      needsReview: false,
      origin: 'claude-code',
      fields: screenFields(g.fields, p, report, g.type),
      claimRefs: refs,
    };
  };

  if (r.mode === 'full') {
    const seen = new Set();
    p.sections = [];
    for (const g of r.sections) {
      if (seen.has(g.type)) { report.warnings.push(`${g.type} が重複しているため2つ目以降を無視しました`); continue; }

// ---------------- テキスト評価と描画 ----------------

function renderInline(project, section, raw, kind, ctx) {
  const a = assessText(project, section, raw);
  if (kind === 'safe') {
    if (!a.publishable) {
      ctx.removed.push({ section: SECTION_CATALOG[section.type].label, text: a.text.slice(0, 60), reasons: reasonsOf(a) });
      return null;
    }
    return e(a.text);
  }
  if (a.publishable) return e(a.text);
  const why = reasonsOf(a).join(' / ');
  return `<span class="flag" title="${e(why)}">${e(a.text)}</span><span class="flag-tag">未確認</span>`;
}

function reasonsOf(a) {
  const r = [];
  if (a.placeholder) r.push('要記入が残っている');
  for (const t of a.unresolvedTokens) r.push(`${BRIEF_LABELS[t.key] || t.key}が${t.reason === 'unconfirmed' ? '未確定' : '未入力'}`);
  for (const c of a.claims.filter((x) => !x.resolved)) r.push(`${c.label}「${c.match}」の根拠なし`);
  return r;
}

function paragraphs(html) {
  if (html == null) return '';
  return html.split(/\n+/).filter(Boolean).map((p) => `<p>${p}</p>`).join('');
}

function list(project, s, key, kind, ctx) {
  return (s.fields[key] || []).map((v) => renderInline(project, s, v, kind, ctx)).filter((x) => x != null);
}

function ctaInline(ctaInfo, note = '') {
  return `<a class="cta-inline" href="${e(ctaInfo.href)}"${ctaInfo.external ? ' rel="noopener noreferrer"' : ''}><span class="cta-ico" aria-hidden="true"></span><span>${ctaInfo.labelHtml}</span></a>${note}`;
}

// FVのバッジ: 根拠セクションが参照する verified かつ数値付きの evidence がある場合だけ出す（未検証の実績は出さない）
function fvBadge(project, kind) {
  const proof = project.sections.find((x) => x.type === 'proof' && (kind !== 'safe' || x.approved));
  if (!proof) return '';
  const ev = project.evidence.find((x) => proof.claimRefs.includes(x.id) && x.status === 'verified' && Number.isFinite(x.metricValue));
  if (!ev) return '';
  return `<a class="badge stage s4" href="#s-${e(proof.id)}" aria-label="${e(ev.claim)}（根拠へ）"><span><strong>${e(ev.metricValue.toLocaleString('ja-JP'))}</strong>${e(ev.metricUnit)}<br>根拠あり</span></a>`;
}

function sectionHtml(project, s, kind, ctx, ctaInfo, bgIndex) {
  const t = s.type;
  const F = (k) => (s.fields[k] ? renderInline(project, s, s.fields[k], kind, ctx) : null);
  const heading = F('heading');
  const lead = F('lead');
  const body = F('body');
  const note = F('note');
  const items = list(project, s, 'items', kind, ctx);
  const alt = list(project, s, 'itemsAlt', kind, ctx);
  const bg = bgIndex % 2 === 0 ? 'bg-paper' : 'bg-grid';
  const h2 = heading ? `<h2>${heading}</h2>` : '';
  const leadP = lead ? `<p class="lead">${lead}</p>` : '';
  const noteP = note ? `<p class="src">${note}</p>` : '';
  const anchor = `id="s-${e(s.id)}"`;
  let content = '';
  switch (t) {
    case 'fv': {
      const top = project.brief.audience.value ? renderInline(project, s, '{{audience}}へ', kind, ctx) : null;
      const product = project.brief.product.value ? renderInline(project, s, '{{product}}', kind, ctx) : null;
      const offer = project.brief.offer.value ? renderInline(project, s, '{{offer}}', kind, ctx) : null;
      const badge = fvBadge(project, kind);
      return `<header class="fv" ${anchor}>
${top ? `<div class="fv-top stage s1"><div class="wide">${top}</div></div>` : ''}
<div class="fv-hero"><div class="wide hero-grid"><div class="copy">
${lead ? `<p class="kicker stage s1">${lead}</p>` : ''}
${heading ? `<h1 class="stage s2">${heading}</h1>` : ''}
${body ? `<div class="sub stage s3">${paragraphs(body)}</div>` : ''}
</div><div class="fv-visual stage s3" aria-hidden="true">
<div class="bp-card c1"><b>01</b><i></i><i></i><i></i></div><div class="bp-card c2"><b>02</b><i></i><i></i><i></i></div><div class="bp-card c3"><b>03</b><i></i><i></i><i></i></div>
${product ? `<span class="bp-chip">${product}</span>` : ''}</div>${badge}</div></div>
<div class="fv-offer stage s4"><div class="wide"><div class="offer-row"><span class="offer-tag">今回のご案内</span>${offer ? `<span class="offer-big">${offer}</span>` : ''}</div>
${ctaInline(ctaInfo)}<span class="scroll-hint" aria-hidden="true">⌄</span></div></div></header>`;
    }
    case 'concept_video':
      content = `${h2}${leadP}<div class="card" role="note">${body ? paragraphs(body) : ''}</div>`;
      break;
    case 'empathy':
      content = `${h2}${leadP}${body ? paragraphs(body) : ''}<div class="cards">${items.map((i) => `<div class="card bubble reveal">${i}</div>`).join('')}</div>`;
      break;
    case 'reframe':
      content = `${h2}${leadP}${body ? paragraphs(body) : ''}${items.length || alt.length ? `<div class="compare reveal"><div class="col before"><h3>これまで</h3><ul class="plain">${items.map((i) => `<li>${i}</li>`).join('')}</ul></div><div class="col after"><h3>これから</h3><ul class="plain">${alt.map((i) => `<li>${i}</li>`).join('')}</ul></div></div>` : ''}`;
      break;
    case 'steps':
      content = `${h2}${leadP}${body ? paragraphs(body) : ''}<ol class="steps">${items.map((i) => `<li class="ncard reveal"><h3>${i}</h3></li>`).join('')}</ol>`;
      break;
    case 'scope':
    case 'fit': {
      const [a, b] = t === 'scope' ? ['含まれるもの', '含まれないもの'] : ['向いている人', '向いていない人'];
      content = `${h2}${leadP}${body ? paragraphs(body) : ''}<div class="compare reveal"><div class="col after"><h3>${a}</h3><ul class="plain yes">${items.map((i) => `<li>${i}</li>`).join('')}</ul></div><div class="col before"><h3>${b}</h3><ul class="plain no">${alt.map((i) => `<li>${i}</li>`).join('')}</ul></div></div>`;
      break;
    }
    case 'recommit':
      return `<section class="band" ${anchor}><div class="wrap reveal">${h2}${leadP}${body ? paragraphs(body) : ''}${ctaInline(ctaInfo)}</div></section>`;
    case 'proof': {
      const refs = new Set(s.claimRefs);
      const evs = project.evidence.filter((x) => refs.has(x.id) && (kind !== 'safe' || x.status === 'verified'));
      const cards = evs.map((ev) => {
        const unverified = ev.status !== 'verified';
        const metric = Number.isFinite(ev.metricValue)
          ? (unverified ? `<span class="metric">${e(String(ev.metricValue))}<small>${e(ev.metricUnit)}</small></span>`
            : `<span class="metric"><span data-count="${e(String(ev.metricValue))}">${e(String(ev.metricValue))}</span><small>${e(ev.metricUnit)}</small></span>`)
          : '';
        const claimHtml = unverified ? `<span class="flag">${e(ev.claim)}</span><span class="flag-tag">未検証</span>` : e(ev.claim);
        return `<div class="card reveal">${metric}<div>${claimHtml}</div><span class="src">出典: ${e(ev.source)}${unverified ? '' : `（確認 ${e(ev.verifiedAt)}）`}</span></div>`;
      });
      ctx.proofCount = evs.length;
      for (const ev of project.evidence.filter((x) => refs.has(x.id) && x.status !== 'verified')) {
        if (kind === 'safe') ctx.removed.push({ section: '根拠', text: ev.claim.slice(0, 60), reasons: ['未検証の根拠'] });
      }
      content = `${h2}${leadP}${body ? paragraphs(body) : ''}<div class="proof-grid">${cards.join('')}</div>`;
      break;
    }
    case 'closing':
      return `<section class="band closing" ${anchor}><div class="wrap reveal">${h2}${leadP}${body ? paragraphs(body) : ''}${ctaInline(ctaInfo, noteP)}</div></section>`;
    case 'footer':
      return `<footer ${anchor}><div class="wrap">${body ? paragraphs(body) : ''}${noteP}</div></footer>`;
    default:
      content = `${h2}${leadP}${body ? `<div class="reveal">${paragraphs(body)}</div>` : ''}`;
  }
  return `<section class="${bg}" ${anchor}><div class="wrap">${content}${t === 'concept_video' ? '' : noteP}</div></section>`;
}

function sectionHasContent(s, html) {
  if (s.type === 'proof') return /class="card/.test(html);
  return /<(h1|h2|p|li|div class="card)/.test(html.replace(/<span class="eyebrow[^]*?<\/span>/, ''));
}

function resolveCta(project, kind, ctx, variantId) {
  const base = variantId ? project.cta.variants.find((v) => v.id === variantId) : null;
  const v = base ? { ...base, label: base.label || project.brief.ctaLabel.value } : activeCta(project);
  const url = safeUrl(project.brief.ctaUrl.value);
  const urlOk = url && project.brief.ctaUrl.status === 'confirmed';
  const labelFromBrief = !(base ? base.label : project.cta.variants.find((x) => x.id === project.cta.activeVariant)?.label);
  const labelOk = v.label && (!labelFromBrief || project.brief.ctaLabel.status === 'confirmed');
  const verified = project.evidence.filter((x) => x.status === 'verified');
  const labelClaims = detectClaims(v.label, project.brief.category).filter((c) => c.severity === 'block' || !verified.some((ev) => ev.claim.normalize('NFKC').includes(c.match.normalize('NFKC'))));
  if (kind === 'safe') {
    if (!urlOk) ctx.blockers.push('CTAリンク先が確定していない、または許可されないURLです');
    if (!labelOk) ctx.blockers.push('CTA文言が確定していません');
    if (labelClaims.length) ctx.blockers.push(`CTA文言に根拠の無い主張: ${labelClaims.map((c) => c.match).join(', ')}`);
  }
  const ok = urlOk && labelOk && !labelClaims.length;
  const labelHtml = ok || kind === 'safe' ? e(v.label || 'CTA') : `<span class="flag">${e(v.label || '【CTA文言 未入力】')}</span><span class="flag-tag">未確認</span>`;
  return { href: url || '#', external: !!url && url.startsWith('https:'), labelHtml, variant: v };
}

function mixHex(a, b, t) {
  const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v * (1 - t) + pb[i] * t).toString(16).padStart(2, '0')).join('');
}

function contrastChecks(project, variant) {
  const b = project.brand;
  const fvText = readableOn(b.primary);
  const ctaText = readableOn(variant.color);
  return [
    { name: '本文（ink / paper）', ratio: contrastRatio(b.ink, b.paper) },
    { name: '本文（ink / 白カード）', ratio: contrastRatio(b.ink, '#ffffff') },
    { name: 'FV見出し（ink / 淡色面）', ratio: contrastRatio(b.ink, '#f1f1f3') },
    { name: `CTA「${variant.id}」固定バー 文字 / 背景`, ratio: contrastRatio(ctaText, variant.color) },
    { name: `CTA「${variant.id}」固定バー 文字 / グラデーション終端`, ratio: contrastRatio(ctaText, mixHex(variant.color, b.accent, 0.3)) },
    { name: `CTA「${variant.id}」白ピル 文字`, ratio: contrastRatio(inkFor(variant.color, '#ffffff'), '#ffffff') },
    { name: '上部帯・オファー帯の文字', ratio: Math.min(contrastRatio(fvText, b.primary), contrastRatio(fvText, b.accent)) },
  ].map((c) => ({ ...c, ok: c.ratio >= 4.5 }));
}

/**
 * kind: 'preview'（編集中の確認。未確認は旗付き）/ 'draft'（レビュー用export。バナー+noindex）/ 'safe'（公開可能なものだけ）
 * view: 'design' | 'wf'
 */
function renderPage(project, { kind = 'preview', view = 'design', ctaVariantId = null } = {}) {
  const ctx = { removed: [], blockers: [], warnings: [], proofCount: 0 };
  if (view === 'wf') return { html: renderWireframe(project), report: ctx };
  const ctaInfo = resolveCta(project, kind, ctx, ctaVariantId);
  const variant = ctaInfo.variant;
  const contrast = contrastChecks(project, variant);
  for (const c of contrast.filter((x) => !x.ok)) {
    (kind === 'safe' ? ctx.blockers : ctx.warnings).push(`コントラスト不足: ${c.name} ${c.ratio}:1（4.5:1 以上が必要）`);
  }
  const parts = [];
  let bgIndex = 0;
  for (const s of project.sections) {
    const meta = SECTION_CATALOG[s.type];
    if (kind === 'safe' && !s.approved) {
      if (meta.required) ctx.blockers.push(`必須セクション「${meta.label}」が未承認です`);
      else ctx.removed.push({ section: meta.label, text: '(セクション全体)', reasons: ['未承認'] });
      continue;
    }
    const html = sectionHtml(project, s, kind, ctx, ctaInfo, s.type === 'fv' ? 0 : bgIndex++);
    if (kind === 'safe' && !sectionHasContent(s, html)) {
      if (meta.required) ctx.blockers.push(`必須セクション「${meta.label}」に公開できる内容がありません`);
      else ctx.removed.push({ section: meta.label, text: '(セクション全体)', reasons: ['公開できる内容なし'] });
      continue;
    }
    parts.push(html);
  }
  if (kind === 'safe') {
    for (const t of Object.keys(SECTION_CATALOG).filter((t) => SECTION_CATALOG[t].required)) {
      if (!project.sections.some((s) => s.type === t)) ctx.blockers.push(`必須セクション「${SECTION_CATALOG[t].label}」がありません`);
    }
    if (project.brief.operator.status !== 'confirmed') ctx.blockers.push('運営者表記が確定していません');
  }
  const scriptHash = sha256Base64(RUNTIME_SCRIPT);

      id: 'h-cta', title: 'CTAの文言・色・表示タイミングの比較', evidenceType: 'heuristic',
      basis: ['プレビュー上のCTA案（実配信はしていない）', ...vs],
      hypothesis: '固定CTAの出し方を変えると、本文を読み終える前の誤クリックや見落としが変わるかもしれない',
      metric: `主要: ${cvDef}（分母 ${unit}）。補助: CTAクリック率`, guardrails: [...guardBase, 'クリック率だけ上がりCVが下がっていないか'],
      stopConditions: stopBase, priority: priority(2, 1, 1),
      caution: '一般論からの仮説で、このLPでの観測はまだない。実配信は別途の承認が必要（このツールは配信しない）',
    });
  }
  if (main) {
    const notEval = main.comparisons.filter((c) => c.verdict === 'not-evaluable');
    if (notEval.length) {
      H.push({
        id: 'h-continue', title: `「${main.name}」は判定せず、条件を満たすまで継続または設計し直す`, evidenceType: 'observed-fictional',
        basis: notEval.flatMap((c) => c.reasons).slice(0, 4),
        hypothesis: '現時点のデータから案の優劣は言えない。必要サンプルに届く見込みがあれば継続、なければMDEを見直す',
        metric: `主要: ${cvDef}（分母 ${unit}）`, guardrails: guardBase,
        stopConditions: [estDays ? `現在の流入なら約 ${estDays} 日で必要サンプルに到達（最長 ${LPO_RULES.maxDurationDays} 日を超えるなら設計を見直す）` : '到達見込みは計算できない', ...stopBase],
        priority: priority(2, 3, 1),
        caution: '途中経過の差を根拠に打ち切らない',
      });
    }
  }
  return H.sort((a, b) => b.priority.score - a.priority.score);
}

function analyzeLpo(project) {
  const ds = project.lpo?.dataset;
  if (!ds) return { ok: false, message: 'LPOデータセットが未設定です（架空データを読み込んでください）', connections: CONNECTIONS };
  if (ds.fictional !== true) return { ok: false, message: '実データは扱いません（fictional: true の架空データのみ）', connections: CONNECTIONS };
  const analyses = ds.experiments.map(analyzeExperiment);
  const pairs = [];
  for (let i = 0; i < ds.experiments.length; i++) {
    for (let j = i + 1; j < ds.experiments.length; j++) {
      const c = comparability(ds.experiments[i], ds.experiments[j]);
      pairs.push({ a: ds.experiments[i].name, b: ds.experiments[j].name, ...c });
    }
  }
  return {
    ok: true, fictional: true, banner: `架空データ「${ds.name}」による分析です。実在の実績・計測結果ではありません。`,
    rules: LPO_RULES, connections: CONNECTIONS, analyses, crossPeriod: pairs, hypotheses: buildHypotheses(project, analyses),
  };
}

return { normInv, wilson, twoProportionP, requiredSamplePerArm, analyzeExperiment, comparability, buildHypotheses, analyzeLpo, LPO_RULES, CONNECTIONS, normCdf, chiSquareP };

}

      h('textarea', { id: 'gen-prompt', rows: 16, readonly: true, value: prompt, 'aria-label': '生成指示' }),

function render() {

  if (!p) return;
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const scrollY = window.scrollY;
  $('#project-name').value = p.name;
  $('#btn-undo').disabled = !state.undo.length;
  $('#btn-redo').disabled = !state.redo.length;
  $('#ai-status').textContent = 'AI生成: ブラウザからは未接続。テンプレート下書き（AI生成ではない）と、Claude Code との prompt→JSON 受け渡しのみ動作します。';
  document.querySelectorAll('[role=tab]').forEach((t) => {
    const on = t.dataset.tab === state.tab;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.tabIndex = on ? 0 : -1;
  });
  const panel = $('#panel');
  panel.setAttribute('aria-labelledby', `tab-${state.tab}`);
  const view = { brief: renderBrief, plan: renderPlan, design: renderDesign, cta: renderCta, export: renderExport, lpo: renderLpo, gen: renderGen }[state.tab](p);
  panel.replaceChildren(view);
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el !== document.activeElement) el.focus({ preventScroll: true });
  }
  window.scrollTo(0, scrollY);
  storageSet(UI_KEY, JSON.stringify({ tab: state.tab, selected: state.selected, mode: state.mode }));
}

// ---------------- 起動 ----------------
function bindChrome() {
  $('#btn-undo').addEventListener('click', undo);
  $('#btn-redo').addEventListener('click', redo);
  $('#btn-save').addEventListener('click', () => {
    download(`${safeName(state.project)}.lpstudio.json`, serializeProject({ ...state.project, schemaVersion: SCHEMA_VERSION }), 'application/json');
    toast('project JSON を保存しました');
  });
  $('#file-load').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 2 * 1024 * 1024) { toast('ファイルが大きすぎます（2MBまで）', 'error'); return; }
    loadJsonText(await f.text(), f.name);
    e.target.value = '';
  });
  $('#btn-load').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file-load').click(); } });
  $('#btn-seed').addEventListener('click', async () => { try { state.selected = null; commit(await loadSeed()); toast('架空seedを読み込みました'); } catch (e) { toast(e.message, 'error'); } });
  $('#btn-new').addEventListener('click', () => { state.selected = null; commit(emptyProject()); toast('新規プロジェクト（ブリーフから入力してください）'); setTab('brief'); });
  $('#project-name').addEventListener('change', (e) => edit({ type: 'setName', value: e.target.value }));
  const tabs = [...document.querySelectorAll('[role=tab]')];
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => setTab(t.dataset.tab));
    t.addEventListener('keydown', (e) => {
      let j = null;
      if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
      if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
      if (e.key === 'Home') j = 0;
      if (e.key === 'End') j = tabs.length - 1;
      if (j != null) { e.preventDefault(); setTab(tabs[j].dataset.tab); tabs[j].focus(); }
    });
  });
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    if (typing) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  });
}

async function boot() {
  bindChrome();
  const ui = (() => { try { return JSON.parse(storageGet(UI_KEY) || '{}'); } catch { return {}; } })();
  if (ui.mode && MODE_LABEL[ui.mode]) state.mode = ui.mode;
  if (ui.selected) state.selected = ui.selected;
  const saved = storageGet(AUTOSAVE_KEY);
  const restored = saved ? parseProjectJson(saved) : null;
  if (restored && restored.ok) {
    state.project = restored.project;
    toast('前回の編集を復元しました（再開）');
  } else {
    try { state.project = await loadSeed(); } catch { state.project = emptyProject(); }
    if (saved) toast('前回の保存データが読めなかったため架空seedで開きました', 'error');
  }
  const hashTab = location.hash.slice(1);
  state.tab = TABS.includes(hashTab) ? hashTab : (TABS.includes(ui.tab) ? ui.tab : 'brief');
  history.replaceState({ tab: state.tab }, '', `#${state.tab}`);
  render();
  document.body.dataset.ready = '1';
}
boot();

return {  };
})();

})();</script>
